                    s.active = true; 
                    s.age = 0; 
                    s.life = 10.0 + Math.random(); 
                    s.baseScale = 0.1 + Math.random() * 0.9;
                    
                    const angle = s.offsetPhase; 
                    const distFactor = Math.random(); 
                    const radiusX = (RADIUS_X * distFactor) + (Math.random() - 0.5) * 0.5;
                    const radiusY = (RADIUS_Y * distFactor) + (Math.random() - 0.5) * 0.2;

                    s.distFromCenter = Math.sqrt(radiusX*radiusX + radiusY*radiusY);

                    s.originPos.set(cartelX + radiusX * Math.cos(angle), 
                                    cartelY + radiusY * Math.sin(angle), 
                                    cartelZ + (Math.random() - 0.5) * 2.0);
                                    
                    s.position.copy(s.originPos);
                    
                    s.velocity.set((Math.random() - 0.5) * 0.3 * SPEED_FACTOR, 
                                    (Math.random() - 0.5) * 0.3 * SPEED_FACTOR, 
                                    (Math.random() - 0.5) * 0.3 * SPEED_FACTOR); 
                }
            }

            resetCoinsAndFX() { 
                this.dummy.scale.set(0,0,0); this.dummy.updateMatrix(); 
                if (this.coinInstancedMesh) { 
                    for(let i=0; i < this.COIN_COUNT; i++) { this.coinsData[i].active = false; this.coinInstancedMesh.setMatrixAt(i, this.dummy.matrix); } 
                    this.coinInstancedMesh.instanceMatrix.needsUpdate = true; 
                }
                if (this.sparkleInstancedMesh) {
                    for(let i=0; i < this.SPARKLE_COUNT; i++) { 
                        this.sparklesData[i].active = false; 
                        this.sparkleInstancedMesh.setMatrixAt(i, this.dummy.matrix); 
                    }
                    this.sparkleInstancedMesh.instanceMatrix.needsUpdate = true;
                }
            }

            updateSequence(time) {
                if (!this.winSequence.active) {
                    if (this.shineLight) this.shineLight.position.set(0, 50, 0); 
                    return;
                }
                
                const elapsed = time - this.winSequence.startTime;
                const PHASE3_START = 2.0;
                const SEQUENCE_DURATION = PHASE3_START + 5.0; 

                if (elapsed >= PHASE3_START && !this.winSequence.fxSpawned) {
                      this.spawnCoins(); 
                      this.spawnSparkles();
                      this.winSequence.fxSpawned = true;
                      
                      // DISPARAR SONIDO DE MONEDAS
                      if(this.coinAudio) this.coinAudio.triggerBurst(5.0);

                      if(this.resultGroup) { 
                        this.resultGroup.visible = true;
                        this.resultGroup.position.z = 45.0; 
                        
                        // DISPARAR ANIMACIÓN DEL MODELO AQUÍ (SINCRONIZADA)
                        if (this.currentWinAction) {
                            this.currentWinAction.reset();
                            this.currentWinAction.play();
                        }
                      }
                }

                if (elapsed >= PHASE3_START && elapsed < SEQUENCE_DURATION && this.resultGroup && this.resultGroup.visible) {
                    const effectTime = elapsed - PHASE3_START;
                    let currentZ = 0;

                    if (effectTime < 1.0) {
                        const t = effectTime / 1.0;
                        const ease = 1 - Math.pow(1 - t, 3); 
                        currentZ = 45.0 - (45.0 - 15.0) * ease;
                    } 
                    else if (effectTime < 2.5) {
                        const t = (effectTime - 1.0) / 1.5;
                        currentZ = 15.0 - (15.0 - 14.0) * t;
                    } 
                    else {
                        const t = (effectTime - 2.5);
                        const accel = t * t * 15.0; 
                        currentZ = 14.0 + accel;
                    }

                    this.resultGroup.position.z = currentZ;

                    if (this.shineLight) {
                          const sweep = Math.sin(time * 3.0) * 10.0;
                          this.shineLight.position.set(sweep, 0, 5.0);
                    }
                }
                
                if (elapsed >= SEQUENCE_DURATION) {
                    this.winSequence.active = false;
                    this.isRewardActive = false;
                    if(this.resultGroup) { this.resultGroup.visible = false; }
                    this.resetCoinsAndFX();
                    
                    const names = this.torresState.baseSymbols;
                    if (names.includes('Torre')) {
                        this.startTorresMode();
                    } else {
                         this.isButtonDisabled = false; 
                    }
                }
            }

            updateSymbolVisibility() {
                const delta = Math.min(this.clock.getDelta(), 0.1); 
                const visualDelta = 0.016; 

                this.reels.forEach((reelGroup, globalIndex) => {
                    if (!reelGroup.visible && reelGroup.position.z > this.SEPARACION_CAPAS * 0.5) return; 

                    const reelAngle = reelGroup.rotation.x;
                    const forceSingleSymbol = (this.isTorresActive || this.isFusionActive);
                    const forcedIndex = this.reelStates[globalIndex].targetIndex;

                    reelGroup.children.forEach((pivotGroup, childIndex) => {
                        const symbolAngle = pivotGroup.rotation.x; 
                        let totalAngle = (reelAngle + symbolAngle) % (Math.PI * 2); 
                        if(totalAngle < 0) totalAngle += (Math.PI * 2);

                        const cosA = Math.cos(totalAngle);
                        
                        const symbolWrapper = pivotGroup.children[0]; 
                        if (symbolWrapper) {
                            symbolWrapper.traverse((child) => {
                                if (child.isMesh && child.material && child.userData.originalColor) {
                                    
                                    // --- REGLA DE ORO DE VISIBILIDAD (CORREGIDA) ---
                                    let forceVisible = false;
                                    if (globalIndex < 3 && (this.isTorresActive || this.isFusionActive)) {
                                        // Si es un rodillo base y coincide con el índice objetivo, NO TOCAR
                                        if (childIndex === forcedIndex) forceVisible = true;
                                    }

                                    if (forceSingleSymbol && !forceVisible) {
                                        if (childIndex !== forcedIndex && forcedIndex !== -1) {
                                            child.visible = false;
                                            return; 
                                        }
                                    }

                                    if (child.userData.isExploded) {
                                        child.visible = false; 
                                        return; 
                                    }

                                    if (child.userData.isPulsing) {
                                        child.userData.pulseTimer += visualDelta * 5.0; 
                                        const sine = (Math.sin(child.userData.pulseTimer) + 1) * 0.5; 
                                        
                                        const color1 = new THREE.Color(0xFF4500); 
                                        const color2 = new THREE.Color(0xFFFF00); 
                                        const finalColor = color1.lerp(color2, sine);
                                        
                                        child.material.emissive.copy(finalColor);
                                        child.material.emissiveIntensity = 0.2 + (sine * 0.6); 
                                        
                                        const scale = 1.0 + (sine * 0.1);
                                        child.scale.set(scale, scale, scale);

                                    } else {
                                        let isSpecial = false;
                                        for(let s of this.swellingMeshes) { if(s.mesh === child) isSpecial = true; }
                                        for(let p of this.popInMeshes) { if(p.mesh === child) isSpecial = true; }
                                        for(let f of this.activeFusions) { if(f.mesh === child) isSpecial = true; }
                                        
                                        if(!isSpecial) {
                                            child.scale.set(1, 1, 1);
                                        }
                                        
                                        child.material.emissiveIntensity = child.userData.originalEmissiveIntensity;
                                        if(child.userData.originalEmissiveColor) {
                                            child.material.emissive.copy(child.userData.originalEmissiveColor);
                                        }
                                        child.material.color.copy(child.userData.originalColor);
                                    }

                                    let brightness = (cosA > 0) ? Math.pow(cosA, 0.5) : 0.05;
                                    let rowOpacity = 1.0; 

                                    if (this.isTorresActive || this.isFusionActive) { 
                                         rowOpacity = 1.0; 
                                    } else {
                                        child.userData.fadeLevel = 1.0;
                                        if(!child.userData.isExploded) child.visible = true;
                                    }

                                    let finalOpacity = rowOpacity * child.userData.fadeLevel;
                                    child.material.opacity = finalOpacity;
                                    child.material.alphaTest = (finalOpacity < 0.01) ? 0 : 0.5;
                                    
                                    if (!child.userData.isPulsing) {
                                        child.material.color.copy(child.userData.originalColor).multiplyScalar(brightness);
                                    } 
                                    
                                    if ((this.isTorresActive || this.isFusionActive) && rowOpacity < 0.5) {
                                        child.castShadow = false;
                                    } else {
                                        child.castShadow = true;
                                    }
                                }
                            });
                        }
                    });
                });
            }

            updateParticles(delta, time) {
                this.updateSwellings(delta);
                this.updatePopIns(delta); 
                this.updateFusions(delta);
                this.updateFloatingTexts(delta);
                this.updateLevelIndicators(); 
                
                if(this.lockedParticles) this.lockedParticles.update(delta, this.activeCamera);

                for (let i = this.activeExplosions.length - 1; i >= 0; i--) {
                    const finished = !this.activeExplosions[i].update(delta);
                    if (finished) {
                        this.activeExplosions.splice(i, 1);
                    }
                }

                if(this.coinInstancedMesh) {
                    this.coinsData.forEach((data, i) => {
                        if (data.active) {
                            data.velocity.y -= this.COIN_GRAVITY * delta;
                            data.position.addScaledVector(data.velocity, delta);

                            if (data.position.y < -50) {
                                data.active = false;
                            }
                            
                            data.life -= delta;
                            if (data.life <= 0) data.active = false; 

                            data.rotation.x += 5 * delta; data.rotation.y += 3 * delta;

                            this.dummy.position.copy(data.position);
                            this.dummy.rotation.copy(data.rotation);
                            this.dummy.scale.set(this.COIN_SCALE, this.COIN_SCALE, this.COIN_SCALE);
                            this.dummy.updateMatrix();
                            this.coinInstancedMesh.setMatrixAt(i, this.dummy.matrix);
                        } else {
                            this.dummy.scale.set(0,0,0); this.dummy.updateMatrix();
                            this.coinInstancedMesh.setMatrixAt(i, this.dummy.matrix);
                        }
                    });
                    this.coinInstancedMesh.instanceMatrix.needsUpdate = true;
                }

                if(this.sparkleInstancedMesh) {
                    const elapsedTotal = time - this.winSequence.startTime;
                    const PHASE3_START = 2.0;
                    const effectTime = (this.winSequence.active && elapsedTotal > PHASE3_START) ? (elapsedTotal - PHASE3_START) : 0;
                    
                    const isExiting = (effectTime > 2.5);
                    const exitTime = isExiting ? (effectTime - 2.5) : 0;

                    this.sparklesData.forEach((s, i) => {
                        if(s.active) {
                            s.age += delta;
                            s.life -= delta;
                            
                            s.position.addScaledVector(s.velocity, delta);
                            
                            let appearFactor = Math.min(s.age / 0.5, 1.0);

                            if (isExiting) {
                                const delay = s.distFromCenter * 0.05; 
                                if (exitTime > delay) {
                                    s.velocity.z += 50.0 * delta; 
                                }
                            }
                            
                            const pulseFactor = 0.75 + 0.25 * Math.sin(time * 8 + s.offsetPhase);
                            const finalScale = s.baseScale * pulseFactor * appearFactor;

                            if(s.life <= 0) s.active = false;
                            
                            this.dummy.position.copy(s.position);
                            this.dummy.quaternion.copy(this.activeCamera.quaternion); 
                            this.dummy.scale.set(finalScale, finalScale, finalScale);
                            this.dummy.updateMatrix();
                            this.sparkleInstancedMesh.setMatrixAt(i, this.dummy.matrix);
                        } else {
                            this.dummy.scale.set(0,0,0); this.sparkleInstancedMesh.setMatrixAt(i, this.dummy.matrix);
                        }
                    });
                    this.sparkleInstancedMesh.instanceMatrix.needsUpdate = true;
                }
            }

            animate() {
                requestAnimationFrame(this.animate.bind(this));
                const delta = Math.min(this.clock.getDelta(), 0.1);
                const time = this.clock.getElapsedTime();
                const timeScale = delta * 60;

                if(this.buttonMixer) this.buttonMixer.update(delta);
                this.updateSequence(time); 
                this.updateParticles(delta, time); 
                this.updateSymbolVisibility();
                if (this.winMixer) this.winMixer.update(delta);

                let allIdle = true;
                this.reels.forEach((r, i) => {
                    const s = this.reelStates[i];
                    if(!r.visible && i >= this.NUM_CARRETES) { s.mode = 'IDLE'; return; }
                    
                    if(s.mode === 'SPINNING') { 
                        allIdle = false; 
                        if(s.velocity < s.targetSpeed) s.velocity = s.targetSpeed; 
                        r.rotation.x += s.velocity * timeScale; 
                    } else if(s.mode === 'STOPPING') { 
                        allIdle = false; 
                        const remaining = s.targetAngle - r.rotation.x;
                        const friction = s.isSlowFall ? 0.05 : 0.1;
                        const step = remaining * friction * timeScale; 
                        r.rotation.x += step;
                        if(Math.abs(remaining) < 0.001) { 
                            r.rotation.x = s.targetAngle; 
                            s.mode = 'IDLE'; 
                            r.rotation.x = r.rotation.x % (Math.PI * 2);
                        }
                    }
                });
                
                if(allIdle && this.machineIsSpinning) { 
                    this.machineIsSpinning = false; 
                    if (!this.isTorresActive) { 
                        this.checkResults();
                    }
                }

                let targetBtnInt = 0; let targetLightInt = 0; 
                let targetSun = this.config.sunIntensity; let targetFill = this.config.fillIntensity;

                const effectiveHover = (this.isHovering && !this.isButtonDisabled && !this.isRewardActive && !this.isTorresActive && !this.isFusionActive); 

                if (effectiveHover !== this.wasHoveringState) {
                    this.wasHoveringState = effectiveHover;
                }

                if (this.isRewardActive || this.isTorresActive || this.isFusionActive) { targetSun = this.config.sunIntensity; targetFill = this.config.fillIntensity;
                } else if (effectiveHover) { targetSun = this.config.sunIntensity * 0.5; targetFill = 0.0; }
                
                if (this.sunLight) this.sunLight.intensity += (targetSun - this.sunLight.intensity) * 0.1;
                if (this.fillLight) this.fillLight.intensity += (targetFill - this.fillLight.intensity) * 0.1;

                if (this.isLightFlashing) {
                    targetBtnInt = this.CLICK_BTN_EMISSIVE; targetLightInt = this.config.lightClickInt; if(this.pointLight) this.pointLight.color.setHex(0xFFFFFF);
                } else {
                    targetBtnInt = effectiveHover ? this.config.btnHoverEmissive : this.config.btnIdleEmissive;
                    targetLightInt = 0; 
                    if(this.pointLight) this.pointLight.color.setHex(0xFFAA00);
                }

                if (this.spinButtonMesh && this.spinButtonMesh.material) this.spinButtonMesh.material.emissiveIntensity += (targetBtnInt - this.spinButtonMesh.material.emissiveIntensity) * 0.2;
                if (this.pointLight) { this.pointLight.intensity += (targetLightInt - this.pointLight.intensity) * 0.2; } 

                // --- LÓGICA DE CÁMARA ---
                
                if (this.isEditorMode) {
                    this.controls.update();
                    this.updateDebugPanel(); 
                } else {
                    let currentTargetZ = this.targetZ;
                    let currentTargetY = this.targetY;
                    let currentTargetRotX = this.targetRotX;
                    let currentTargetRotY = this.targetRotY;
                    let currentTargetRotZ = this.targetRotZ;

                    let cameraInterpolationSpeed = 0.05;
                    let skipPositionUpdate = false; 
                    
                    if (this.winSequence.active && !this.isTorresActive && !this.isVRMode) {
                        const elapsed = time - this.winSequence.startTime;
                        if (elapsed < 1.0) {
                            const t = elapsed / 1.0;
                            const ease = t * (2 - t);
                            currentTargetZ = THREE.MathUtils.lerp(this.targetZ, this.Z_ZOOM, ease);
                            currentTargetY = this.targetY;
                            cameraInterpolationSpeed = 0.15; 
                        } 
                        else if (elapsed < 2.0) {
                            const t = (elapsed - 1.0) / 1.0;
                            const ease = t * t * (3 - 2 * t);
                            currentTargetZ = THREE.MathUtils.lerp(this.Z_ZOOM, this.targetZ, ease);
                            currentTargetY = this.targetY;
                            cameraInterpolationSpeed = 0.15; 
                        }
                        else {
                            currentTargetZ = this.targetZ; 
                            currentTargetY = this.targetY;
                        }

                    } else {
                        currentTargetZ = this.targetZ;
                        currentTargetY = this.targetY;
                    }
                    
                    if (!skipPositionUpdate) {
                        this.activeCamera.rotation.x += (currentTargetRotX - this.activeCamera.rotation.x) * cameraInterpolationSpeed * timeScale;
                        this.activeCamera.rotation.y += (currentTargetRotY - this.activeCamera.rotation.y) * cameraInterpolationSpeed * timeScale;
                        this.activeCamera.rotation.z += (currentTargetRotZ - this.activeCamera.rotation.z) * cameraInterpolationSpeed * timeScale;

                        this.activeCamera.position.x += (this.targetX - this.activeCamera.position.x) * cameraInterpolationSpeed * timeScale;
                        this.activeCamera.position.z += (currentTargetZ - this.activeCamera.position.z) * cameraInterpolationSpeed * timeScale;
                        this.activeCamera.position.y += (currentTargetY - this.activeCamera.position.y) * cameraInterpolationSpeed * timeScale;
                    } else {
                        const rotationSpeed = cameraInterpolationSpeed; 
                        this.activeCamera.rotation.x += (currentTargetRotX - this.activeCamera.rotation.x) * rotationSpeed * timeScale;
                        this.activeCamera.rotation.y += (currentTargetRotY - this.activeCamera.rotation.y) * rotationSpeed * timeScale;
                        this.activeCamera.rotation.z += (currentTargetRotZ - this.activeCamera.rotation.z) * rotationSpeed * timeScale;
                    }
                }

                if(this.isVRMode) this.effectVR.render(this.scene, this.activeCamera);
                else if (this.config.aoEnabled && this.composer) this.composer.render();
                else this.renderer.render(this.scene, this.activeCamera);
            }
            
            init() {
                this.setupRenderer();
                this.setupVR();
                this.loadingText.innerText = "Cargando Recursos...";
                this.loadResources();
            }

            async loadResources() {
                try {
                    await this.loadEnvironment();
                    this.createLights();
                    this.loadingText.innerText = "Cargando Texturas FX...";
                    const sparkleTex = await this.safeLoadTexture('destello.webp');
                    this.loadingText.innerText = "Cargando Modelos...";
                    
                    const uniqueFiles = [...new Set([...this.ALL_ASSETS_GLB, 'youwin2.glb'])];
                    for (const file of uniqueFiles) await this.safeLoadSymbol(file);
                    
                    await this.safeLoadStructure('cilindro.glb');
                    
                    await this.safeLoadCoins('moneda.glb');
                    
                    this.createParticleSystems(sparkleTex);
                    this.initParticleData();

                    this.loadingText.innerText = "Construyendo Slot...";
                    for(let capa = 0; capa < this.NUM_CAPAS; capa++) {
                        for(let r = 0; r < this.NUM_CARRETES; r++) { this.crearHilera(r, capa); }
                    }
                    this.buildResultContainer(); 
                    this.forceShadows(this.scene);
                    this.initPostProcessing();

                    this.loadingText.innerText = "Optimizando Gráficos...";
                    
                    if(this.resultGroup) { this.resultGroup.visible = true; this.resultGroup.position.set(0, 0, 500); } 
                    this.renderer.compile(this.scene, this.camera);
                    if(this.resultGroup) { 
                        this.resultGroup.visible = false; 
                        this.resultGroup.position.set(0, this.CAM_LAND_Y, this.TEXT_Z_POS); 
                    }

                    this.loadingText.style.display = 'none';
                    this.addEventListeners();
                    this.onWindowResize(); 
                    this.animate();
                } catch (err) {
                    this.loadingText.innerText = "Error: " + err.message; console.error(err);
                }
            }
        }

        const game = new SlotGame();
        game.init();
    </script>
</body>
</html>
