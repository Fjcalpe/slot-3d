        {

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { StereoEffect } from 'three/addons/effects/StereoEffect.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        // IMPORTANTE: SKELETON UTILS PARA CLONAR ANIMACIONES
        import { clone } from 'three/addons/utils/SkeletonUtils.js';
        
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- SISTEMA DE AUDIO (NUEVO) ---
        class CoinAudio {
            constructor() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
                this.masterGain = this.ctx.createGain();
                this.masterGain.connect(this.ctx.destination);
            }

            resume() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }

            triggerBurst(duration = 4.0) {
                this.resume();
                const now = this.ctx.currentTime;
                
                // Volumen global con fade out
                this.masterGain.gain.setValueAtTime(0.4, now);
                this.masterGain.gain.linearRampToValueAtTime(0, now + duration);

                // Generar múltiples osciladores para simular tintineo
                const count = 40; 
                for(let i=0; i<count; i++) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.masterGain);

                    const offset = Math.random() * (duration * 0.6); 
                    const freq = 1200 + Math.random() * 1300; // Frecuencias altas metálicas

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + offset);
                    
                    gain.gain.setValueAtTime(0, now + offset);
                    gain.gain.linearRampToValueAtTime(0.15, now + offset + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.15);

                    osc.start(now + offset);
                    osc.stop(now + offset + 0.2);
                }
            }
        }

        // --- SISTEMA DE PARTÍCULAS ---
        class LockedParticles {
            constructor(scene, texture) {
                this.scene = scene;
                this.particles = [];
                this.limit = 1500; 
                
                const geo = new THREE.PlaneGeometry(0.8, 0.8); 
                const mat = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 1,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    color: 0xFFCC00 
                });
                
                this.mesh = new THREE.InstancedMesh(geo, mat, this.limit);
                this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                this.scene.add(this.mesh);
                
                this.dummy = new THREE.Object3D();
                
                for(let i=0; i<this.limit; i++) {
                    this.particles.push({
                        active: false,
                        pos: new THREE.Vector3(),
                        vel: new THREE.Vector3(),
                        life: 0,
                        maxLife: 1.0,
                        scale: 1.0
                    });
                }
            }

            spawn(position, count = 1) {
                let spawned = 0;
                for(let i=0; i<this.limit; i++) {
                    if(!this.particles[i].active) {
                        const p = this.particles[i];
                        p.active = true;
                        p.pos.copy(position);
                        p.pos.x += (Math.random() - 0.5) * 1.0; 
                        p.pos.y += 1.0 + (Math.random() * 0.5); 
                        p.pos.z += 2.2; 
                        p.vel.set((Math.random() - 0.5) * 0.2, 4.0 + Math.random() * 3.0, 0); 
                        p.life = 0;
                        p.maxLife = 0.5 + Math.random() * 0.5; 
                        p.scale = 0.6 + Math.random() * 0.4;
                        spawned++;
                        if(spawned >= count) break;
                    }
                }
            }

            update(delta, camera) {
                let activeCount = 0;
                for(let i=0; i<this.limit; i++) {
                    const p = this.particles[i];
                    if(p.active) {
                        p.life += delta;
                        if(p.life >= p.maxLife) {
                            p.active = false;
                            this.dummy.scale.set(0,0,0);
                        } else {
                            p.pos.addScaledVector(p.vel, delta);
                            const progress = p.life / p.maxLife;
                            const size = p.scale * Math.pow(1.0 - progress, 1.5); 
                            this.dummy.position.copy(p.pos);
                            this.dummy.quaternion.copy(camera.quaternion);
                            this.dummy.scale.set(size, size, size);
                            activeCount++;
                        }
                    } else {
                        this.dummy.scale.set(0,0,0);
                    }
                    this.dummy.updateMatrix();
                    this.mesh.setMatrixAt(i, this.dummy.matrix);
                }
                if (activeCount > 0 || this.mesh.count > 0) {
                     this.mesh.instanceMatrix.needsUpdate = true;
                }
            }
            
            reset() {
                 for(let i=0; i<this.limit; i++) { this.particles[i].active = false; }
                 this.dummy.scale.set(0,0,0);
                 this.dummy.updateMatrix();
                 for(let i=0; i<this.limit; i++) { this.mesh.setMatrixAt(i, this.dummy.matrix); }
                 this.mesh.instanceMatrix.needsUpdate = true;
            }
        }

        // --- CLASE EXPLOSIÓN (SÓLIDA) ---
        class ExplosionMesh {
            constructor(originalMesh, scene, objectToHide, config, delay = 0) {
                this.scene = scene;
                this.objectToHide = objectToHide; 
                this.delay = delay; 
                this.config = config; 
                this.isActive = true; 
                this.hasExploded = false; 
                this.time = 0;
                
                this.group = new THREE.Group();

                let geometry = originalMesh.geometry.clone();
                if (geometry.index) {
                    geometry = geometry.toNonIndexed();
                }

                const positionAttribute = geometry.attributes.position;
                const vertexCount = positionAttribute.count;
                const triangleCount = vertexCount / 3;

                // 1. GENERAR SEMILLAS (CENTROS DE FRACTURA)
                geometry.computeBoundingBox();
                const bbox = geometry.boundingBox;
                const min = bbox.min;
                const max = bbox.max;
                
                const numFragments = this.config.clusterSize; 
                const seeds = [];
                for(let i=0; i<numFragments; i++) {
                    seeds.push(new THREE.Vector3(
                        min.x + Math.random() * (max.x - min.x),
                        min.y + Math.random() * (max.y - min.y),
                        min.z + Math.random() * (max.z - min.z)
                    ));
                }

                // 2. ASIGNAR TRIÁNGULOS A SEMILLAS
                const fragmentCentroids = new Array(numFragments).fill(0).map(() => new THREE.Vector3());
                const fragmentVertexCounts = new Array(numFragments).fill(0);
                const triangleFragmentMap = new Int16Array(triangleCount);

                const triCenter = new THREE.Vector3();
                const vA = new THREE.Vector3(); const vB = new THREE.Vector3(); const vC = new THREE.Vector3();
                
                for(let t=0; t<triangleCount; t++) {
                    const i = t * 3;
                    vA.set(positionAttribute.getX(i), positionAttribute.getY(i), positionAttribute.getZ(i));
                    vB.set(positionAttribute.getX(i+1), positionAttribute.getY(i+1), positionAttribute.getZ(i+1));
                    vC.set(positionAttribute.getX(i+2), positionAttribute.getY(i+2), positionAttribute.getZ(i+2));
                    
                    triCenter.copy(vA).add(vB).add(vC).multiplyScalar(1/3);

                    let minDist = 999999;
                    let closestSeed = 0;
                    
                    for(let s=0; s<numFragments; s++) {
                        const d = triCenter.distanceToSquared(seeds[s]);
                        if(d < minDist) { minDist = d; closestSeed = s; }
                    }
                    
                    triangleFragmentMap[t] = closestSeed;
                    fragmentCentroids[closestSeed].add(vA).add(vB).add(vC);
                    fragmentVertexCounts[closestSeed] += 3;
                }

                for(let s=0; s<numFragments; s++) {
                    if(fragmentVertexCounts[s] > 0) {
                        fragmentCentroids[s].divideScalar(fragmentVertexCounts[s]);
                    } else {
                        fragmentCentroids[s].copy(seeds[s]);
                    }
                }

                // 3. DATOS ANIMACION
                this.vertexFragmentIndices = new Int16Array(vertexCount);
                this.vertexLocalOffsets = new Float32Array(vertexCount * 3);
                this.fragmentVelocities = [];
                this.fragmentRotations = [];
                
                const radialDir = new THREE.Vector3();
                const noise = new THREE.Vector3();
                
                for(let s=0; s<numFragments; s++) {
                    radialDir.copy(fragmentCentroids[s]).normalize();
                    noise.set(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
                    radialDir.lerp(noise, 0.4).normalize();
                    
                    const speed = this.config.speed + Math.random() * (this.config.speed * 0.5);
                    this.fragmentVelocities.push(radialDir.clone().multiplyScalar(speed));

                    this.fragmentRotations.push({
                        axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize(),
                        speed: (Math.random() * 5.0) + 2.0
                    });
                }

                for(let t=0; t<triangleCount; t++) {
                    const fragId = triangleFragmentMap[t];
                    const centroid = fragmentCentroids[fragId];
                    
                    for(let k=0; k<3; k++) {
                        const idx = t * 3 + k;
                        this.vertexFragmentIndices[idx] = fragId;
                        this.vertexLocalOffsets[idx*3] = positionAttribute.getX(idx) - centroid.x;
                        this.vertexLocalOffsets[idx*3+1] = positionAttribute.getY(idx) - centroid.y;
                        this.vertexLocalOffsets[idx*3+2] = positionAttribute.getZ(idx) - centroid.z;
                    }
                }
                
                this.originalFragmentCentroids = fragmentCentroids;

                const material = originalMesh.material.clone();
                material.side = THREE.DoubleSide; 
                material.transparent = true; 
                material.opacity = 1.0;
                material.alphaTest = 0.5;

                this.mesh = new THREE.Mesh(geometry, material);
                this.group.add(this.mesh);
                
                originalMesh.updateWorldMatrix(true, false);
                const worldPos = new THREE.Vector3();
                const worldQuat = new THREE.Quaternion();
                const worldScale = new THREE.Vector3();
                originalMesh.getWorldPosition(worldPos);
                originalMesh.getWorldQuaternion(worldQuat);
                originalMesh.getWorldScale(worldScale);

                this.group.position.copy(worldPos);
                this.group.quaternion.copy(worldQuat);
                this.group.scale.set(1, 1, 1); 

                this.group.visible = false; 
                this.scene.add(this.group);
            }

            update(delta) {
                if (!this.isActive) return false; 

                if (this.delay > 0) {
                    this.delay -= delta;
                    return true;
                }

                if (!this.hasExploded) {
                    this.hasExploded = true;
                    this.group.visible = true;
                    return true;
                }

                this.time += delta;
                
                const positions = this.mesh.geometry.attributes.position;
                const count = positions.count;
                const gravity = this.config.gravity; 
                const t = this.time;
                
                // Variables reutilizadas
                let ix, iy, iz, fid;
                let cx, cy, cz, ox, oy, oz;
                let theta, cosT, sinT, kx, ky, kz, dot, cX, cY, cZ, rx, ry, rz;
                
                for (let i = 0; i < count; i++) {
                    ix = i * 3; iy = ix + 1; iz = ix + 2;
                    fid = this.vertexFragmentIndices[i];
                    
                    const origC = this.originalFragmentCentroids[fid];
                    const vel = this.fragmentVelocities[fid];
                    const rot = this.fragmentRotations[fid];

                    cx = origC.x + (vel.x * t);
                    cy = origC.y + (vel.y * t) - (0.5 * gravity * t * t);
                    cz = origC.z + (vel.z * t);

                    ox = this.vertexLocalOffsets[ix];
                    oy = this.vertexLocalOffsets[iy];
                    oz = this.vertexLocalOffsets[iz];

                    theta = rot.speed * t;
                    cosT = Math.cos(theta);
                    sinT = Math.sin(theta);
                    kx = rot.axis.x; ky = rot.axis.y; kz = rot.axis.z;
                    
                    dot = kx*ox + ky*oy + kz*oz;
                    
                    cX = ky*oz - kz*oy;
                    cY = kz*ox - kx*oz;
                    cZ = kx*oy - ky*ox;

                    rx = ox*cosT + cX*sinT + kx*dot*(1-cosT);
                    ry = oy*cosT + cY*sinT + ky*dot*(1-cosT);
                    rz = oz*cosT + cZ*sinT + kz*dot*(1-cosT);

                    positions.array[ix] = cx + rx;
                    positions.array[iy] = cy + ry;
                    positions.array[iz] = cz + rz;
                }
                positions.needsUpdate = true;

                if (this.objectToHide && this.objectToHide.visible && this.time > 0.05) {
                    this.objectToHide.visible = false;
                    this.objectToHide.userData.isExploded = true; 
                }

                const life = this.config.life;
                const halfLife = life * 0.5;

                if (this.time < halfLife) {
                    this.mesh.material.opacity = 1.0;
                } else {
                    const fadeProgress = (this.time - halfLife) / halfLife;
                    this.mesh.material.opacity = Math.max(0, 1.0 - fadeProgress);
                }

                if(this.time > life) { 
                    this.cleanup();
                    return false; 
                }
                return true;
            }

            cleanup() {
                this.scene.remove(this.group);
                this.mesh.geometry.dispose();
                if(this.mesh.material.map) this.mesh.material.map.dispose();
                this.mesh.material.dispose();
            }
        }

        class SlotGame {
            constructor() {

                this.torresInfo = document.getElementById('torres-info');

                // DEBUG DOM ELEMENTS
                this.cameraPanel = document.getElementById('camera-panel');
                this.debugToggleBtn = document.getElementById('debug-toggle-btn');
                this.domPX = document.getElementById('d-px'); this.domPY = document.getElementById('d-py'); this.domPZ = document.getElementById('d-pz');

            setupRenderer() {
                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(1); 
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
                this.renderer.toneMapping = THREE.NoToneMapping;
                document.body.appendChild(this.renderer.domElement);
                
                // SETUP ORBIT CONTROLS
                this.controls = new OrbitControls(this.camera, this.renderer.domElement);
                this.controls.enableDamping = true;
                this.controls.dampingFactor = 0.05;
                this.controls.enabled = false; 
            }

            setupVR() {
                this.effectVR = new StereoEffect(this.renderer);
                this.effectVR.eyeSeparation = 0.005;
                this.effectVR.setSize(window.innerWidth, window.innerHeight);
            }

            initPostProcessing() {
                if (!this.config.aoEnabled) { this.composer = null; return; }
                const size = this.renderer.getDrawingBufferSize(new THREE.Vector2());
                const renderTarget = new THREE.WebGLRenderTarget(size.width, size.height, { samples: 4, type: THREE.HalfFloatType });
                this.composer = new EffectComposer(this.renderer, renderTarget);
                const renderPass = new RenderPass(this.scene, this.activeCamera);
                this.composer.addPass(renderPass);
                const ssaoPass = new SSAOPass(this.scene, this.activeCamera, window.innerWidth, window.innerHeight);
                ssaoPass.kernelRadius = this.config.aoRadius;
                ssaoPass.minDistance = this.config.aoMinDist;
                ssaoPass.maxDistance = this.config.maxDist;
                ssaoPass.output = SSAOPass.OUTPUT.Default; 
                this.composer.addPass(ssaoPass);
                const outputPass = new OutputPass();
                this.composer.addPass(outputPass);
            }

            async loadEnvironment() {
                const cubemapTexture = await new Promise((resolve, reject) => this.textureLoader.load('cubemap.jpg', resolve, undefined, reject));
                cubemapTexture.mapping = THREE.EquirectangularReflectionMapping;
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                pmremGenerator.compileEquirectangularShader();
                const envMap = pmremGenerator.fromEquirectangular(cubemapTexture).texture;
                this.scene.environment = envMap;
                cubemapTexture.dispose(); pmremGenerator.dispose();
            }

            async safeLoadTexture(url) {
                return new Promise(resolve => {
                    this.textureLoader.load(url, resolve, undefined, () => {
                        const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
                        const ctx = canvas.getContext('2d');
                        const grd = ctx.createRadialGradient(32,32,2, 32,32,30);
                        grd.addColorStop(0, "white"); grd.addColorStop(1, "rgba(255,255,255,0)");
                        ctx.fillStyle = grd; ctx.fillRect(0,0,64,64);
                        resolve(new THREE.CanvasTexture(canvas));
                    });
                });
            }

            async safeLoadSymbol(file) {
                return new Promise(resolve => {
                    this.loader.load(file, (gltf) => { 
                        // CACHE: Pre-calcular la geometria para explosion (y guardar animaciones)
                        gltf.scene.userData.animations = gltf.animations; 
                        
                        this.symbolMasters[file] = gltf.scene; 
                        resolve(); 
                    }, undefined, () => {
                        const color = file === 'torre.glb' ? 0x9932CC : Math.random() * 0xffffff;
                        const mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: color, transparent: true, alphaTest: 0.5}));
                        const g = new THREE.Group(); g.add(mesh); this.symbolMasters[file] = g; resolve();
                    });
                });
            }

            async safeLoadStructure(file) {
                return new Promise(resolve => {
                    this.loader.load(file, (gltf) => {
                        this.setupStructure(gltf.scene);
                        if(gltf.animations.length) {
                            this.buttonMixer = new THREE.AnimationMixer(gltf.scene);
                            this.buttonAction = this.buttonMixer.clipAction(gltf.animations[0]);
                            this.buttonAction.loop = THREE.LoopOnce; this.buttonAction.clampWhenFinished = true;
                        }
                        this.scene.add(gltf.scene); resolve();
                    }, undefined, () => resolve());
                });
            }

            async safeLoadCoins(file) {
                return new Promise(resolve => {
                    this.loader.load(file, (gltf) => {
                        let geo, mat;
                        gltf.scene.traverse(n => { 
                            if(n.isMesh) { 
                                geo = n.geometry; 
                                mat = n.material; 
                            } 
                        });
                        
                        this.createCoinMesh(geo, mat); 
                        resolve();
                    }, undefined, () => {
                        
                        const geo = new THREE.CylinderGeometry(0.5,0.5,0.1,8);
                        const mat = new THREE.MeshStandardMaterial({color:0xffd700});
                        this.createCoinMesh(geo, mat); 
                        resolve();
                    });
                });
            }

            createCoinMesh(geo, mat) {
                this.coinInstancedMesh = new THREE.InstancedMesh(geo, mat, this.COIN_COUNT);
                this.coinInstancedMesh.castShadow = false; this.coinInstancedMesh.receiveShadow = true;
                for(let i=0; i<this.COIN_COUNT; i++) { this.dummy.scale.set(0,0,0); this.dummy.updateMatrix(); this.coinInstancedMesh.setMatrixAt(i, this.dummy.matrix); }
                this.coinInstancedMesh.instanceMatrix.needsUpdate = true; this.scene.add(this.coinInstancedMesh);
            }
            
            createLights() {
                const amb = new THREE.AmbientLight(0xffffff, 0.6); this.scene.add(amb);
                this.sunLight = new THREE.DirectionalLight(0xfffee0, this.config.sunIntensity);
                this.sunLight.position.set(-10, this.config.sunPosY, this.config.sunPosZ);
                this.sunLight.castShadow = true; 
                this.sunLight.target.position.set(0, 0, 0); this.scene.add(this.sunLight.target);
                this.sunLight.shadow.mapSize.set(1024, 1024);
                const d = 30; this.sunLight.shadow.camera.left = -d; this.sunLight.shadow.camera.right = d; this.sunLight.shadow.camera.top = d; this.sunLight.shadow.camera.bottom = -d;
                this.sunLight.shadow.bias = -0.0005; this.sunLight.shadow.normalBias = 0.02; this.scene.add(this.sunLight);

                const fillPivot = new THREE.Object3D(); fillPivot.rotation.set(-3.06, -1.36, -2.31); this.scene.add(fillPivot);
                this.fillLight = new THREE.DirectionalLight(this.config.fillColor, this.config.fillIntensity);
                this.fillLight.position.set(-8.10, -4.57, -7.28); fillPivot.add(this.fillLight);

                this.pointLight = new THREE.PointLight(0xffaa00, 0, 100);
                this.pointLight.position.set(0, -5, 16);
                this.pointLight.castShadow = false; 
                this.scene.add(this.pointLight);
            }

            setupStructure(node) {
                this.structureGroup = node;
                if (node.name.toLowerCase() === 'spin') {
                    this.spinGroup = node;
                    node.traverse((child) => { if (child.isMesh) { child.material = child.material.clone(); child.userData.origColor = child.material.color.clone(); if(child.name.includes('arrow')) this.spinArrowMesh = child; else this.spinButtonMesh = child; } });
                }
            }

            crearHilera(index, capaIndex) {
                const reelGroup = new THREE.Group();
                reelGroup.position.x = (index * this.SEPARACION_CARRETES) - ((this.NUM_CARRETES - 1) * this.SEPARACION_CARRETES / 2);
                this.scene.add(reelGroup); this.reels.push(reelGroup);
                const radioActual = this.RADIO_ORBITA_BASE + (capaIndex * this.SEPARACION_CAPAS);

                if (capaIndex > 0) { reelGroup.visible = false; }

                for (let i = 0; i < this.NUM_ITEMS_POR_RUEDA; i++) {
                    const glbName = this.REEL_SYMBOLS_GLB[i % this.REEL_SYMBOLS_GLB.length]; 
                    let master = this.symbolMasters[glbName];
                    if (!master) {
                        const m = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color:0xff0000}));
                        master = new THREE.Group(); master.add(m);
                    }
                    const model = master.clone();
                    model.traverse(child => {
                        if (child.isMesh) {
                            child.material = child.material.clone();
                            child.material.transparent = true; child.material.opacity = 1.0; 
                            child.material.alphaTest = 0.5; 
                            child.userData.originalColor = child.material.color.clone();
                            
                            if (child.material.emissive) {
                                child.userData.originalEmissiveColor = child.material.emissive.clone();
                            } else {
                                child.userData.originalEmissiveColor = new THREE.Color(0x000000);
                            }

                            child.userData.originalEmissiveIntensity = child.material.emissiveIntensity !== undefined ? child.material.emissiveIntensity : 1.0;
                            if (child.material.emissive && (child.material.emissive.r > 0 || child.material.emissive.g > 0 || child.material.emissive.b > 0)) {
                                 child.material.emissiveIntensity = child.userData.originalEmissiveIntensity;
                            }
                            
                            child.userData.fadeLevel = 1.0; child.userData.isFading = false;
                            child.userData.isExploded = false;
                            child.userData.isPulsing = false; 
                            child.userData.pulseTimer = 0;
                        }
                    });
                    const pivot = new THREE.Group(); pivot.rotation.x = (i * this.ANGLE_STEP);
                    model.position.set(0, 0, radioActual); pivot.add(model); reelGroup.add(pivot);
                }
            }

            createParticleSystems(sparkleTex) {
                const sparkleMat = new THREE.MeshBasicMaterial({ map: sparkleTex, color: 0xffffff, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
                const geoS = new THREE.PlaneGeometry(0.3, 0.3); 
                this.sparkleInstancedMesh = new THREE.InstancedMesh(geoS, sparkleMat, this.SPARKLE_COUNT);
                this.sparkleInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                this.scene.add(this.sparkleInstancedMesh);
                
                this.dummy.scale.set(0,0,0); this.dummy.updateMatrix();
                for(let i=0; i<this.COIN_COUNT; i++) { this.coinInstancedMesh.setMatrixAt(i, this.dummy.matrix); }
                for(let i=0; i<this.SPARKLE_COUNT; i++) { this.sparkleInstancedMesh.setMatrixAt(i, this.dummy.matrix); }

                this.lockedParticles = new LockedParticles(this.scene, sparkleTex);
            }

            initParticleData() {
                for(let i=0; i<this.COIN_COUNT; i++) { 
                    this.coinsData.push({ position: new THREE.Vector3(), velocity: new THREE.Vector3(), rotation: new THREE.Euler(), active: false, life: 20.0 + Math.random(), offsetPhase: Math.random() * Math.PI * 2 }); 
                }
                for(let i=0; i<this.SPARKLE_COUNT; i++) { 
                    this.sparklesData.push({ 
                        position: new THREE.Vector3(), originPos: new THREE.Vector3(), velocity: new THREE.Vector3(), 
                        active: false, life: 10.0 + Math.random(), 
                        baseScale: 0.1 + Math.random() * 0.9, 
                        offsetPhase: Math.random() * Math.PI * 2,
                        age: 0,
                        distFromCenter: 0
                    }); 
                }
            }
            
            buildResultContainer() {
                if (this.resultGroup) return; 
                this.resultGroup = new THREE.Group();
                
                const master = this.symbolMasters['youwin2.glb'] || this.symbolMasters['noel.glb']; 
                const resultModel = master ? master.clone() : new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xffd700}));
                this.resultGroup.add(resultModel);
                
                this.shineLight = new THREE.PointLight(0xffffff, 150, 15); 
                this.shineLight.position.set(0, 50, 0); 
                this.resultGroup.add(this.shineLight);

                this.resultGroup.position.set(0, this.CAM_LAND_Y, this.TEXT_Z_POS); 
                this.resultGroup.visible = false; 
                this.scene.add(this.resultGroup);
            }


            forceShadows(parent) {
                parent.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true; child.receiveShadow = true;
                        if(child.material && (child.material.transparent || child.material.alphaTest > 0)) {
                            child.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: child.material.map, alphaTest: 0.5 });
                        }
                    }
                });
            }

            addEventListeners() {
                window.addEventListener('resize', this.onWindowResize.bind(this));
                window.addEventListener('pointerdown', this.onPointerDown.bind(this));
                window.addEventListener('pointermove', this.onPointerMove.bind(this));
                document.getElementById('vr-btn').addEventListener('click', this.toggleVR.bind(this));
                document.getElementById('enter-fs-btn').addEventListener('click', this.requestFullscreen.bind(this));
                document.getElementById('fs-manual-btn').addEventListener('click', this.toggleFullscreen.bind(this));
                document.getElementById('debug-toggle-btn').addEventListener('click', this.toggleEditorMode.bind(this));
                document.getElementById('copy-cam-btn').addEventListener('click', this.copyCameraParams.bind(this));
                document.addEventListener('fullscreenchange', this.checkOrientation.bind(this));
                document.addEventListener('webkitfullscreenchange', this.checkOrientation.bind(this));

                // EVENT LISTENERS PARA SLIDERS
                const updateExplosionConfig = () => {
                    this.explosionConfig.gravity = parseFloat(this.inpGrav.value);
                    this.valGrav.innerText = this.explosionConfig.gravity;

                    this.explosionConfig.life = parseFloat(this.inpLife.value);
                    this.valLife.innerText = this.explosionConfig.life;

                    this.explosionConfig.clusterSize = parseInt(this.inpClust.value);
                    this.valClust.innerText = this.explosionConfig.clusterSize;

                    this.explosionConfig.speed = parseFloat(this.inpSpd.value);
                    this.valSpd.innerText = this.explosionConfig.speed;
                };

                this.inpGrav.addEventListener('input', updateExplosionConfig);
                this.inpLife.addEventListener('input', updateExplosionConfig);
                this.inpClust.addEventListener('input', updateExplosionConfig);
                this.inpSpd.addEventListener('input', updateExplosionConfig);
            }

            toggleEditorMode() {
                this.isEditorMode = !this.isEditorMode;
                this.controls.enabled = this.isEditorMode;
                
                if (this.isEditorMode) {
                    this.debugToggleBtn.classList.add('active');
                    this.cameraPanel.style.display = 'block';
                } else {
                    this.debugToggleBtn.classList.remove('active');
                    this.cameraPanel.style.display = 'none';
                }
            }

            copyCameraParams() {
                const p = this.activeCamera.position;
                const r = this.activeCamera.rotation;
                const text = `this.CAM_TORRES_X = ${p.x.toFixed(2)}; this.CAM_TORRES_Y = ${p.y.toFixed(2)}; this.CAM_TORRES_Z = ${p.z.toFixed(2)};
this.CAM_TORRES_RX = ${r.x.toFixed(2)}; this.CAM_TORRES_RY = ${r.y.toFixed(2)}; this.CAM_TORRES_RZ = ${r.z.toFixed(2)};`;
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copy-cam-btn');
                    const oldText = btn.innerText;
                    btn.innerText = "¡COPIADO!";
                    setTimeout(() => btn.innerText = oldText, 1000);
                });
            }

            updateDebugPanel() {
                if(!this.isEditorMode) return;
                const p = this.activeCamera.position;
                const r = this.activeCamera.rotation;
                this.domPX.innerText = p.x.toFixed(2);
                this.domPY.innerText = p.y.toFixed(2);
                this.domPZ.innerText = p.z.toFixed(2);
                this.domRX.innerText = r.x.toFixed(2);
                this.domRY.innerText = r.y.toFixed(2);
                this.domRZ.innerText = r.z.toFixed(2);
            }

            toggleVR() { 
                this.isVRMode = !this.isVRMode; 
                if (this.isVRMode) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); this.activeCamera = this.camera; } 
                else { if (document.exitFullscreen) document.exitFullscreen(); this.onWindowResize(); } 
                this.adjustCameraTarget(); 
            }
            
            requestFullscreen() { 
                const docEl = document.documentElement; 
                const requestMethod = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen; 
                if (requestMethod) { requestMethod.call(docEl).then(() => { document.getElementById('landscape-overlay').style.display = 'none'; this.checkOrientation(); }).catch(e => { document.getElementById('landscape-overlay').style.display = 'none'; }); } 
            }

            toggleFullscreen() { 
                if (!document.fullscreenElement && !document.webkitFullscreenElement) { this.requestFullscreen(); } 
                else { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } 
            }

            onWindowResize() { 
                const w = window.innerWidth, h = window.innerHeight; 
                this.renderer.setSize(w, h); 
                if(this.composer) { this.composer.setSize(w, h); } 
                this.effectVR.setSize(w, h); 
                this.camera.aspect = w / h; 
                this.camera.updateProjectionMatrix(); 
                this.checkOrientation(); 
                this.adjustCameraTarget();
            }
            
            checkOrientation() { 
                if (!this.isMobile) return; 
                const isLandscape = window.innerWidth > window.innerHeight; 
                const isFS = document.fullscreenElement || document.webkitFullscreenElement; 
                document.getElementById('landscape-overlay').style.display = (isLandscape && !isFS) ? 'flex' : 'none';
            }
            
            adjustCameraTarget() { 
                const aspect = window.innerWidth / window.innerHeight; 
                if (this.isTorresActive || this.isFusionActive) {
                    this.targetX = this.CAM_TORRES_X; this.targetY = this.CAM_TORRES_Y; this.targetZ = this.CAM_TORRES_Z;
                    this.targetRotX = this.CAM_TORRES_RX; this.targetRotY = this.CAM_TORRES_RY; this.targetRotZ = this.CAM_TORRES_RZ;
                } else {
                    this.targetRotY = this.config.camRotY; this.targetRotZ = this.config.camRotZ; this.targetX = 0.0; 
                    if (aspect >= 1.0) { 
                        this.camera.fov = 40; this.targetZ = this.CAM_LAND_DIST; this.targetY = this.CAM_LAND_Y; this.targetRotX = this.config.landscapeRotX;
                    } else { 
                        this.camera.fov = 75; this.targetZ = (this.CYLINDER_TARGET_WIDTH / 2.0) / (aspect * Math.tan(THREE.MathUtils.degToRad(this.camera.fov / 2.0)));
                        this.targetY = this.CAM_PORT_Y; this.targetRotX = this.config.portraitRotX;
                    } 
                    if (this.isVRMode) { this.targetZ = this.Z_VR; this.targetY = 0; this.targetX = 0; this.targetRotX = 0; } 
                }
                this.camera.updateProjectionMatrix(); 
            }

            onPointerMove(e) { 
                this.pointer.x = (e.clientX / window.innerWidth) * 2 - 1; 
                this.pointer.y = - (e.clientY / window.innerHeight) * 2 + 1; 
                if (!this.isButtonDisabled && (this.spinGroup || this.structureGroup)) { 
                    this.raycaster.setFromCamera(this.pointer, this.activeCamera); 
                    let hit = false; 
                    if (this.spinGroup && this.raycaster.intersectObject(this.spinGroup, true).length > 0) hit = true; 
                    else if (this.structureGroup && this.raycaster.intersectObject(this.structureGroup, true).length > 0) hit = true; 
                    this.isHovering = hit; 
                    document.body.style.cursor = hit ? 'pointer' : 'default'; 
                } else { 
                    this.isHovering = false; 
                    document.body.style.cursor = 'default'; 
                } 
            }

            onPointerDown(e) { 
                if (this.isEditorMode) return; 
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return; 
                if (this.isButtonDisabled) return; 
                this.pointer.x = (e.clientX / window.innerWidth) * 2 - 1; 
                this.pointer.y = - (e.clientY / window.innerHeight) * 2 + 1; 
                this.raycaster.setFromCamera(this.pointer, this.activeCamera); 
                let hit = false; 
                if (this.spinGroup && this.raycaster.intersectObject(this.spinGroup, true).length > 0) hit = true; 
                if (!hit && this.structureGroup && this.raycaster.intersectObject(this.structureGroup, true).length > 0) hit = true; 
                if (hit) this.spinMachine(); 
            }

            hardResetVisuals() {
                this.reels.forEach(reelGroup => {
                    reelGroup.children.forEach(pivot => {
                        const wrapper = pivot.children[0];
                        if (wrapper) {
                            wrapper.visible = true; 
                            wrapper.traverse(c => {
                                if (c.isMesh) {
                                    c.visible = true; 
                                    c.material.opacity = 1.0;
                                    c.userData.isFading = false;
                                    c.userData.isExploded = false; 
                                    c.userData.isPulsing = false;
                                    c.scale.set(1,1,1);
                                    if(c.userData.originalEmissiveIntensity !== undefined) {
                                        c.material.emissiveIntensity = c.userData.originalEmissiveIntensity;
                                    }
                                    if(c.userData.originalColor) {
                                        c.material.color.copy(c.userData.originalColor);
                                    }
                                }
                            });
                        }
                    });
                });
                
                this.activeExplosions.forEach(ex => ex.cleanup());
                this.activeExplosions = [];
                this.swellingMeshes = [];
                this.popInMeshes = [];
                this.activeFusions = [];
                this.cleanLevelTexts();
                if(this.lockedParticles) this.lockedParticles.reset();
            }

            spinMachine() {
                // Activar contexto de audio al interactuar
                if (this.coinAudio) this.coinAudio.resume();

                if (this.machineIsSpinning || this.isButtonDisabled) return;

                this.hardResetVisuals();

                if (this.isTorresActive || this.isFusionActive) { 
                    this.cleanupTorresVisuals(); 
                    this.isTorresActive = false; 
                    this.isFusionActive = false;
                    this.torresInfo.classList.remove('active'); 
                }

                this.machineIsSpinning = true; this.isButtonDisabled = true; this.isZoomed = false;
                this.adjustCameraTarget(); this.resetCoinsAndFX();
                if (this.resultGroup) { this.resultGroup.visible = false; } 
                if(this.buttonAction) { this.buttonAction.reset(); this.buttonAction.play(); }
                this.isLightFlashing = true; setTimeout(() => this.isLightFlashing = false, 200);
                
                this.spinCounter++; 
                this.debugCycleDiv.innerText = `Tirada: ${this.spinCounter}`;

                // --- LOGICA DE TRUCAJE (CICLO DE 3) ---
                let targetIndices = [0, 0, 0]; 
                
                const cycle = (this.spinCounter - 1) % 3;

                if (cycle === 0) {
                     // 1. PREMIO REGULAR (Noel x3)
                     targetIndices = [0, 0, 0];
                } else if (cycle === 1) {
                     // 2. TIRADA PERDEDORA (Regular)
                     targetIndices = [1, 2, 3];
                } else {
                     // 3. ENTRADA TORRES (Torre en rodillo 1)
                     targetIndices = [4, 0, 0];
                }
                
                const BASE_REELS = [0, 1, 2];
                BASE_REELS.forEach(i => {
                    this.reelStates[i].mode = 'SPINNING'; 
                    this.reelStates[i].velocity = 0.35; 
                    this.reelStates[i].isSlowFall = false; 
                });
                for(let i=3; i < this.NUM_CARRETES * this.NUM_CAPAS; i++) { this.reelStates[i].mode = 'IDLE'; }

                for (let i = 0; i < this.NUM_CARRETES; i++) setTimeout(() => {
                    const globalIndex = i;
                    const state = this.reelStates[globalIndex]; 
                    state.mode = 'STOPPING';
                    const currentRot = this.reels[globalIndex].rotation.x; 
                    const nextRound = Math.ceil(currentRot / (Math.PI*2)) + 2 + i;
                    
                    let finalIndex = targetIndices[i];
                    state.targetAngle = (nextRound * Math.PI * 2) - (finalIndex * this.ANGLE_STEP);

                }, 200 + (i * 600)); 
            }

            checkResults() {
                const resultIndices = [this.reels[0], this.reels[1], this.reels[2]].map(r => { 
                    let ang = r.rotation.x % (Math.PI*2); if(ang < 0) ang += (Math.PI*2); 
                    const indexAtAngle = Math.round((2 * Math.PI - ang) / this.ANGLE_STEP) % this.NUM_ITEMS_POR_RUEDA;
                    return indexAtAngle;
                });
                
                const names = resultIndices.map(i => this.NOMBRES_SIMBOLOS[i]);
                this.torresState.baseSymbols = [...names];
                this.torresState.baseIndices = [...resultIndices]; // GUARDAMOS LOS ÍNDICES REALES

                const hasTorre = names.includes('Torre'); 
                
                if (hasTorre) {
                    setTimeout(() => this.startTorresMode(), 500);
                    return; 
                }

                const hasRegularWin = (names[0] === names[1] && names[1] === names[2]);
                if (hasRegularWin) {
                    this.triggerWin(names); 
                } else { 
                    this.isButtonDisabled = false; 
                }
            }

            triggerWin(names) {
                // MODIFICADO: COMPROBACION DE SEGURIDAD PARA EL MODELO WIN
                let modelFile = 'youwin2.glb';
                let master = this.symbolMasters[modelFile];
                
                // FALLBACK: Si no existe o es el "cubo rojo" de error
                if(!master || (master.children[0] && master.children[0].geometry && master.children[0].geometry.type === 'BoxGeometry')) {
                    master = this.symbolMasters['noel.glb']; // Usar Noel como backup seguro
                }

                if (this.resultGroup) {
                    this.resultGroup.remove(...this.resultGroup.children); 
                    
                    // USO DE SKELETON UTILS PARA CLONAR ANIMACIONES
                    const resultModel = clone(master);
                    
                    // Si tiene animacion (ej: es el youwin2 bueno), la preparamos pero NO la reproducimos aún
                    if (master && master.userData.animations && master.userData.animations.length > 0) {
                         // Detener mixer anterior si existe
                         if (this.winMixer) {
                             this.winMixer.stopAllAction();
                         }
                         this.winMixer = new THREE.AnimationMixer(resultModel);
                         this.currentWinAction = this.winMixer.clipAction(master.userData.animations[0]);
                         // IMPORTANTE: Resetear y parar. La reproducimos cuando entra en pantalla.
                         this.currentWinAction.reset();
                         this.currentWinAction.stop(); 
                    } else {
                        this.currentWinAction = null;
                    }
                    
                    this.resultGroup.add(resultModel);
                    this.resultGroup.add(this.shineLight); 
                    this.resultGroup.visible = false;
                    this.resultGroup.position.set(0, this.activeCamera.position.y, this.activeCamera.position.z + 50);
                }

                this.isButtonDisabled = true; this.isRewardActive = true;
                this.winSequence.active = true; 
                this.winSequence.startTime = this.clock.getElapsedTime(); 
                this.winSequence.fxSpawned = false; 
                this.winSequence.didAnchorZoomOut = false; 
                
                this.adjustCameraTarget(); 
            }

            // --- END GAME TORRES ---
            endGameWithWin() {
                this.isFusionActive = false; 
                this.torresInfo.classList.remove('active'); 
                this.cleanupTorresVisuals();
                this.stopAllEffects(); // NUEVA FUNCION: PARA LATIDOS
                this.showTorresWin(); 
            }

            stopAllEffects() {
                this.reels.forEach(reel => {
                    reel.children.forEach(pivot => {
                        const wrapper = pivot.children[0];
                        wrapper.traverse(c => {
                            if(c.isMesh) {
                                c.userData.isPulsing = false;
                                c.userData.pulseTimer = 0;
                                c.scale.set(1,1,1);
                                if(c.userData.originalEmissiveColor) {
                                    c.material.emissive.copy(c.userData.originalEmissiveColor);
                                }
                                c.material.emissiveIntensity = c.userData.originalEmissiveIntensity;
                            }
                        });
                    });
                });
            }

            showTorresWin() {
                this.isButtonDisabled = true;
                this.isRewardActive = true; 
                
                // Mostrar Cartel
                this.winBanner.classList.add('visible');
                
                // Ocultar despues de 4 segundos
                setTimeout(() => {
                    this.winBanner.classList.remove('visible');
                    this.isRewardActive = false;
                    this.isButtonDisabled = false;
                    this.adjustCameraTarget(); // Resetear camara si es necesario
                }, 4000);
            }

            startTorresMode() {
                this.isTorresActive = true; this.isButtonDisabled = true;
                this.isFusionActive = false;
                
                this.hardResetVisuals();

                // 20 SPINS EN MODO TORRES
                this.torresState.totalSpins = 20; 
                this.torresState.spinsLeft = this.torresState.totalSpins; 
                this.torresState.currentLayer = 1; this.torresState.spinThreshold = 3; 
                this.torresState.lockedReels = [[true, true, true], [false, false, false], [false, false, false]];
                this.torresState.layer1Symbols = [null, null, null];
                this.torresInfo.classList.add('active'); 
                this.torresCountSpan.innerText = this.torresState.spinsLeft;
                
                this.toggleLayerVisibility(1, false); 
                this.toggleLayerVisibility(2, false); 

                // USAR LOS INDICES REALES GUARDADOS, NO BUSCAR POR NOMBRE
                for(let i=0; i<3; i++) {
                    const realIndex = this.torresState.baseIndices[i];
                    this.reelStates[i].targetIndex = realIndex;
                }

                this.adjustCameraTarget();
                
                setTimeout(this.spinTorresLoop.bind(this), 2000); 
            }

            toggleLayerVisibility(layerIdx, isVisible) {
                const startIdx = layerIdx * this.NUM_CARRETES;
                for(let i=0; i<this.NUM_CARRETES; i++) { 
                    if(this.reels[startIdx + i]) this.reels[startIdx + i].visible = isVisible; 
                }
            }

            cleanupTorresVisuals() {
                this.toggleLayerVisibility(1, false);
                this.toggleLayerVisibility(2, false);
                this.cleanLevelTexts();
                this.adjustCameraTarget();
            }

            cleanLevelTexts() {
                this.levelTexts.forEach(t => t.remove());
                this.levelTexts = [];
            }

            resetReelVisuals(globalIndex) {
                const r = this.reels[globalIndex];
                if (!r) return;
                r.children.forEach(pivot => {
                    const wrapper = pivot.children[0];
                    if (wrapper) {
                        wrapper.visible = true; 
                        wrapper.traverse(c => {
                            if (c.isMesh) {
                                c.visible = true; 
                                c.material.opacity = 1.0;
                                c.material.transparent = false; 
                                c.userData.isFading = false;
                                c.userData.isExploded = false; 
                                c.userData.isPulsing = false;
                                c.scale.set(1,1,1);
                                if(c.userData.originalEmissiveIntensity !== undefined) {
                                    c.material.emissiveIntensity = c.userData.originalEmissiveIntensity;
                                } else {
                                    c.material.emissiveIntensity = 0;
                                }
                                if(c.userData.originalEmissiveColor) {
                                    c.material.emissive.copy(c.userData.originalEmissiveColor);
                                }
                                if(c.userData.originalColor) {
                                    c.material.color.copy(c.userData.originalColor);
                                }
                            }
                        });
                    }
                });
            }

            spinTorresLoop() {
                this.torresCountSpan.innerText = this.torresState.spinsLeft;

                // COMPROBACION EARLY EXIT (Si capas llenas, salir)
                const layer1Full = this.torresState.lockedReels[1].every(Boolean);
                const layer2Full = this.torresState.lockedReels[2].every(Boolean);

                if (layer1Full && layer2Full) {
                     this.waitForExplosionsAndEnd();
                     return;
                }
                
                if (this.torresState.currentLayer === 1 && layer1Full) {
                     this.torresState.currentLayer = 2; 
                     setTimeout(this.spinTorresLoop.bind(this), 1000);
                     return;
                }
                
                if (this.torresState.spinsLeft <= 0) { 
                    this.waitForExplosionsAndEnd(); 
                    return; 
                }

                const layerIdx = this.torresState.currentLayer;

                if (layerIdx > 1) {
                    const prevLayer = layerIdx - 1;
                    const prevStartIdx = prevLayer * this.NUM_CARRETES;
                    for (let i = 0; i < 3; i++) {
                        if (!this.torresState.lockedReels[prevLayer][i]) {
                            if(this.reels[prevStartIdx + i]) this.reels[prevStartIdx + i].visible = false;
                        }
                    }
                }

                const startReelIdx = layerIdx * this.NUM_CARRETES;
                for(let i=0; i<3; i++) {
                    if(!this.torresState.lockedReels[layerIdx][i]) {
                        if(this.reels[startReelIdx + i]) this.reels[startReelIdx + i].visible = false;
                    } else {
                        if(this.reels[startReelIdx + i]) this.reels[startReelIdx + i].visible = true;
                    }
                }
                
                const targetIndices = [0,0,0];
                for(let i=0; i<3; i++) {
                    const targetSymbolName = this.torresState.baseSymbols[i];
                    const targetIndex = this.NOMBRES_SIMBOLOS.indexOf(targetSymbolName);
                    
                    if (this.torresState.lockedReels[layerIdx][i]) {
                        targetIndices[i] = targetIndex;
                    } else {
                        // 40% chance
                        if (Math.random() < 0.4) {
                             targetIndices[i] = targetIndex; 
                        } else {
                             let rnd = Math.floor(Math.random() * 8);
                             if(rnd === targetIndex) rnd = (rnd + 1) % 8;
                             targetIndices[i] = rnd;
                        }
                    }
                }
                
                this.currentTorresTargets = targetIndices;
                this.runTorresSequence(0);
                this.torresState.spinsLeft--;
            }

            runTorresSequence(reelStep) {
                if (reelStep > 2) {
                    const layerIdx = this.torresState.currentLayer;
                    const lockedCount = this.torresState.lockedReels[layerIdx].filter(Boolean).length;
                    
                    if (layerIdx === 1 && lockedCount === 3) {
                         this.torresState.currentLayer = 2;
                         setTimeout(this.spinTorresLoop.bind(this), 2000);
                    } else {
                        setTimeout(this.spinTorresLoop.bind(this), 500);
                    }
                    return;
                }

                const layerIdx = this.torresState.currentLayer;
                
                if (this.torresState.lockedReels[layerIdx][reelStep]) {
                    this.runTorresSequence(reelStep + 1);
                    return;
                }
                if (layerIdx === 2 && !this.torresState.lockedReels[1][reelStep]) {
                    this.runTorresSequence(reelStep + 1);
                    return;
                }

                const reelsStartIndex = layerIdx * this.NUM_CARRETES;
                const globalIndex = reelsStartIndex + reelStep;
                const r = this.reels[globalIndex];
                
                r.visible = true; 
                this.resetReelVisuals(globalIndex);
                
                const finalIndex = this.currentTorresTargets[reelStep];
                this.reelStates[globalIndex].targetIndex = finalIndex;
                const nextRound = Math.ceil(r.rotation.x / (Math.PI*2)); 
                const targetAngle = (nextRound * Math.PI * 2) - (finalIndex * this.ANGLE_STEP);
                r.rotation.x = targetAngle;

                for(let j=0; j<this.NUM_ITEMS_POR_RUEDA; j++) {
                    const pivot = r.children[j];
                    const wrapper = pivot.children[0];
                    if (j === finalIndex) {
                        wrapper.traverse(c => {
                            if(c.isMesh) {
                                c.visible = true;
                                c.scale.set(0,0,0); 
                                this.popInMeshes.push({ mesh: c, time: 0, duration: 0.25 });
                            }
                        });
                    } else {
                        wrapper.traverse(c => { if(c.isMesh) c.visible = false; });
                    }
                }

                setTimeout(() => {
                    this.evaluateSingleReel(reelStep, globalIndex);
                }, 350);
            }

            evaluateSingleReel(reelStep, globalIndex) {
                const layerIdx = this.torresState.currentLayer;
                const finalIndex = this.currentTorresTargets[reelStep];
                const currentName = this.NOMBRES_SIMBOLOS[finalIndex];
                
                let targetName = "";
                if (layerIdx === 1) targetName = this.torresState.baseSymbols[reelStep];
                else targetName = this.torresState.layer1Symbols[reelStep];

                let delayNext = 0;

                if (currentName === targetName) {
                    this.torresState.lockedReels[layerIdx][reelStep] = true;
                    if (layerIdx === 1) this.torresState.layer1Symbols[reelStep] = currentName;
                    
                    this.triggerPulseEffect(this.reels[globalIndex], finalIndex);
                    
                    // --- SINCRONIZACIÓN BLINDADA: BASE ---
                    if (layerIdx > 0) {
                         const baseReelIndex = reelStep; 
                         const baseReel = this.reels[baseReelIndex];
                         
                         // Recuperamos el índice REAL que guardamos al entrar en modo Torres
                         const correctBaseIndex = this.torresState.baseIndices[baseReelIndex];
                         this.reelStates[baseReelIndex].targetIndex = correctBaseIndex;

                         baseReel.visible = true;
                         this.triggerPulseEffect(baseReel, correctBaseIndex);
                         
                         const pivot = baseReel.children[correctBaseIndex];
                         if(pivot) {
                             pivot.children[0].traverse(c => { 
                                if(c.isMesh) {
                                    c.visible = true; 
                                    c.material.opacity = 1.0;
                                } 
                             });
                         }
                    }

                    delayNext = 400; 
                } else {
                    this.triggerSymbolExplosion(this.reels[globalIndex], 0, finalIndex);
                    delayNext = 300; 
                }

                setTimeout(() => {
                    this.runTorresSequence(reelStep + 1);
                }, delayNext);
            }

            updatePopIns(delta) {
                for(let i=this.popInMeshes.length-1; i>=0; i--) {
                    const p = this.popInMeshes[i];
                    p.time += delta;
                    let t = Math.min(p.time / p.duration, 1.0);
                    
                    let scale = 1;
                    if (t < 1) {
                        const c4 = (2 * Math.PI) / 3;
                        scale = Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
                    }
                    
                    p.mesh.scale.set(scale, scale, scale);
                    if(t >= 1) this.popInMeshes.splice(i, 1);
                }
            }

            triggerPulseEffect(reelGroup, targetIndex) {
                const pivot = reelGroup.children[targetIndex];
                if (pivot) {
                    const wrapper = pivot.children[0];
                    wrapper.traverse(c => {
                        if(c.isMesh) {
                            c.userData.isPulsing = true;
                            c.userData.pulseTimer = 0;
                        }
                    });
                }
            }

            triggerSymbolExplosion(reelGroup, delay, targetIndex) {
                const pivot = reelGroup.children[targetIndex];
                if (pivot) {
                    const wrapper = pivot.children[0];
                    let targetMesh = null;
                    wrapper.traverse(c => {
                        if(c.isMesh && !targetMesh) targetMesh = c; 
                    });

                    if (targetMesh) {
                        targetMesh.visible = true;
                        targetMesh.scale.set(1,1,1);
                        targetMesh.material.opacity = 1.0;
                        
                        this.swellingMeshes.push({
                            mesh: targetMesh,
                            wrapper: wrapper,
                            delay: delay,
                            time: 0,
                            duration: 0.2, 
                            scene: this.scene
                        });
                    }
                }
            }

            updateSwellings(delta) {
                for (let i = this.swellingMeshes.length - 1; i >= 0; i--) {
                    const item = this.swellingMeshes[i];
                    item.time += delta;
                    
                    if (item.time < item.delay) continue;

                    const activeTime = item.time - item.delay;
                    const progress = Math.min(activeTime / item.duration, 1.0);
                    
                    const scale = 1.0 + (progress * 0.4); 
                    item.mesh.scale.set(scale, scale, scale);

                    if (progress >= 1.0) {
                        item.mesh.visible = false;
                        // Pasamos this.explosionConfig
                        const explosion = new ExplosionMesh(item.mesh, item.scene, item.wrapper, this.explosionConfig, 0);
                        explosion.update(0); 
                        this.activeExplosions.push(explosion);
                        this.swellingMeshes.splice(i, 1);
                    }
                }
            }

            waitForExplosionsAndEnd() {
                if (this.activeExplosions.length > 0 || this.swellingMeshes.length > 0) {
                    requestAnimationFrame(this.waitForExplosionsAndEnd.bind(this));
                } else {
                    this.startFusionSequence();
                }
            }
            
            startFusionSequence() {
                this.isTorresActive = false;
                this.isFusionActive = true; 
                this.cleanLevelTexts(); // Limpiar textos de nivel al empezar fusion

                for(let col=0; col<3; col++) {
                    const symbolName = this.torresState.baseSymbols[col];
                    const symbolIdx = this.NOMBRES_SIMBOLOS.indexOf(symbolName);
                    this.reelStates[col].targetIndex = symbolIdx;
                    this.reelStates[this.NUM_CARRETES + col].targetIndex = symbolIdx;
                    this.reelStates[this.NUM_CARRETES*2 + col].targetIndex = symbolIdx;
                }

                this.runFusionReel(0); 
            }

            runFusionReel(colIndex) {
                if (colIndex > 2) {
                    this.endGameWithWin();
                    return;
                }

                const hasLayer1 = this.torresState.lockedReels[1][colIndex];
                const hasLayer2 = this.torresState.lockedReels[2][colIndex];

                let sequence = Promise.resolve();

                if (hasLayer2) {
                    sequence = sequence.then(() => this.animateFusionStep(colIndex, 2, 1, "x4"));
                }

                if (hasLayer1) {
                    sequence = sequence.then(() => this.animateFusionStep(colIndex, 1, 0, "x2"));
                }

                sequence.then(() => {
                    setTimeout(() => this.runFusionReel(colIndex + 1), 300);
                });
            }

            animateFusionStep(colIndex, fromLayer, toLayer, textString) {
                return new Promise((resolve) => {
                    const fromReelIdx = (fromLayer * this.NUM_CARRETES) + colIndex;
                    const toReelIdx = (toLayer * this.NUM_CARRETES) + colIndex;
                    
                    const fromReel = this.reels[fromReelIdx];
                    const toReel = this.reels[toReelIdx];
                    
                    const symbolIdx = this.reelStates[fromReelIdx].targetIndex;
                    
                    let fromMesh = null;
                    const fromPivot = fromReel.children[symbolIdx];
                    if(fromPivot) {
                         fromPivot.children[0].traverse(c => { if(c.isMesh) fromMesh = c; });
                    }

                    let toMesh = null;
                    const toPivot = toReel.children[symbolIdx];
                    if(toPivot) {
                         toPivot.children[0].traverse(c => { if(c.isMesh) toMesh = c; });
                    }

                    if (!fromMesh || !toMesh) { resolve(); return; }

                    const clone = fromMesh.clone();
                    const worldPosStart = new THREE.Vector3();
                    const worldPosEnd = new THREE.Vector3();
                    
                    fromMesh.getWorldPosition(worldPosStart);
                    toMesh.getWorldPosition(worldPosEnd);
                    
                    clone.position.copy(worldPosStart);
                    clone.quaternion.copy(fromMesh.getWorldQuaternion(new THREE.Quaternion()));
                    clone.scale.copy(fromMesh.getWorldScale(new THREE.Vector3()));
                    
                    this.scene.add(clone);
                    fromMesh.visible = false; 

                    this.activeFusions.push({
                        mesh: clone,
                        start: worldPosStart,
                        end: worldPosEnd,
                        time: 0,
                        duration: 0.5,
                        onComplete: () => {
                            this.scene.remove(clone);
                            this.createFloatingText(textString, worldPosEnd);
                            resolve();
                        }
                    });
                });
            }

            createFloatingText(text, position) {
                const div = document.createElement('div');
                div.className = 'fusion-text';
                div.innerText = text;
                this.uiContainer.appendChild(div);

                // Ajustamos la posicion inicial un poco más abajo en Y para centrarlo
                const adjustedPos = position.clone();
                adjustedPos.y -= 1.0; 

                const trackData = {
                    element: div,
                    worldPos: adjustedPos,
                    life: 1.5,
                    active: true
                };
                
                requestAnimationFrame(() => { div.classList.add('show'); });

                this.floatingTexts = this.floatingTexts || [];
                this.floatingTexts.push(trackData);
            }

            updateFloatingTexts(delta) {
                if(!this.floatingTexts) return;
                
                for(let i=this.floatingTexts.length-1; i>=0; i--) {
                    const ft = this.floatingTexts[i];
                    ft.life -= delta;
                    
                    if (ft.life <= 0) {
                        ft.element.remove();
                        this.floatingTexts.splice(i, 1);
                        continue;
                    }

                    const screenPos = ft.worldPos.clone().project(this.activeCamera);
                    const x = (screenPos.x * .5 + .5) * window.innerWidth;
                    const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

                    ft.element.style.left = `${x}px`;
                    ft.element.style.top = `${y}px`;
                }
            }

            updateFusions(delta) {
                for(let i=this.activeFusions.length-1; i>=0; i--) {
                    const f = this.activeFusions[i];
                    f.time += delta;
                    const t = Math.min(f.time / f.duration, 1.0);
                    
                    f.mesh.position.lerpVectors(f.start, f.end, t);
                    
                    if (t > 0.5) {
                        const s = 1.0 - ((t - 0.5) * 2.0); 
                        f.mesh.scale.set(s,s,s);
                    }

                    if (t >= 1.0) {
                        if(f.onComplete) f.onComplete();
                        this.activeFusions.splice(i, 1);
                    }
                }
            }

            // --- ACTUALIZAR INDICADORES DE NIVEL ---
            updateLevelIndicators() {
                if (!this.isTorresActive) return;

                // Crear textos si no existen
                if (this.levelTexts.length === 0) {
                    for (let i = 0; i < 3; i++) {
                        const div = document.createElement('div');
                        div.className = 'level-text';
                        div.innerText = "1 LEVEL";
                        this.uiContainer.appendChild(div);
                        this.levelTexts.push(div);
                        setTimeout(() => div.classList.add('visible'), 50);
                    }
                }

                // Actualizar posicion y contenido
                for (let i = 0; i < 3; i++) {
                    const div = this.levelTexts[i];
                    
                    // Determinar nivel
                    let level = 1;
                    if (this.torresState.lockedReels[1][i]) level = 2;
                    if (this.torresState.lockedReels[2][i]) level = 3;
                    
                    const text = (level === 1) ? "1 LEVEL" : level + " LEVELS";
                    if(div.innerText !== text) div.innerText = text;

                    // Posicion (Encima de la capa base)
                    // Obtenemos la posicion del simbolo base correspondiente
                    const reelBase = this.reels[i];
                    
                    // USAR EL ÍNDICE REAL, NO EL NOMBRE
                    const symbolIndex = this.torresState.baseIndices[i];
                    
                    // Encontrar el mesh real para obtener posicion mundo
                    const pivot = reelBase.children[symbolIndex];
                    if (pivot) {
                        const wrapper = pivot.children[0];
                        const tempVec = new THREE.Vector3();
                        wrapper.getWorldPosition(tempVec);
                        // Subimos un poco para que este ENCIMA del simbolo
                        tempVec.y += 2.5; 

                        const screenPos = tempVec.project(this.activeCamera);
                        const x = (screenPos.x * .5 + .5) * window.innerWidth;
                        const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

                        div.style.left = `${x}px`;
                        div.style.top = `${y}px`;
                    }
                }
            }

            endGameWithWin() {
                this.isFusionActive = false; 
                this.torresInfo.classList.remove('active'); 
                this.cleanupTorresVisuals();
                this.stopAllEffects(); // NUEVA FUNCION: PARA LATIDOS
                this.showTorresWin(); 
            }

            stopAllEffects() {
                this.reels.forEach(reel => {
                    reel.children.forEach(pivot => {
                        const wrapper = pivot.children[0];
                        wrapper.traverse(c => {
                            if(c.isMesh) {
                                c.userData.isPulsing = false;
                                c.userData.pulseTimer = 0;
                                c.scale.set(1,1,1);
                                if(c.userData.originalEmissiveColor) {
                                    c.material.emissive.copy(c.userData.originalEmissiveColor);
                                }
                                c.material.emissiveIntensity = c.userData.originalEmissiveIntensity;
                            }
                        });
                    });
                });
            }

            showTorresWin() {
                this.isButtonDisabled = true;
                this.isRewardActive = true; 
                
                // Mostrar Cartel
                this.winBanner.classList.add('visible');
                
                // Ocultar despues de 4 segundos
                setTimeout(() => {
                    this.winBanner.classList.remove('visible');
                    this.isRewardActive = false;
                    this.isButtonDisabled = false;
                    this.adjustCameraTarget(); // Resetear camara si es necesario
                }, 4000);
            }

            spawnCoins() { 
                const MAX_WIDTH_SPAWN = 10.0; 
                const CENTER_SPAWN_X = this.CENTER_X; 
                const COIN_SPAWN_Z = this.SPAWN_Z; 

                for(let i=0; i < this.COIN_COUNT; i++) { 
                    const data = this.coinsData[i]; 
                    data.active = true; 
                    data.life = 5.0 + Math.random(); 
                    
                    const targetHeight = this.MIN_APEX + Math.random() * (this.MAX_APEX - this.MIN_APEX);
                    const height = targetHeight - this.SPAWN_Y;
                    
                    const v0 = Math.sqrt(2 * this.COIN_GRAVITY * height); 
                    
                    data.position.set(CENTER_SPAWN_X + (Math.random() - 0.5) * MAX_WIDTH_SPAWN, 
                                      this.SPAWN_Y, 
                                      COIN_SPAWN_Z + (Math.random() - 0.5) * 2.0); 
                    
                    data.velocity.set((Math.random() - 0.5) * 5.0, 
                                      v0 + (Math.random() * 3.0), 
                                      (Math.random() - 0.5) * 2.0); 
                    
                    data.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI); 
                } 
            }

            spawnSparkles() {
                const cartelX = this.CENTER_X; 
                const cartelY = 1.0; 
                const cartelZ = this.TEXT_Z_POS; 
                
                const RADIUS_X = 10.0; 
                const RADIUS_Y = 2.5;  
                const SPEED_FACTOR = 3.5; 

                if(!this.sparkleInstancedMesh) return;

                for(let i=0; i<this.SPARKLE_COUNT; i++) {
                    const s = this.sparklesData[i];
