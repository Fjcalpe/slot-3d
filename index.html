<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Slot Pro: v98 (Clean Exit)</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #000; 
            font-family: 'Segoe UI', sans-serif; touch-action: none; 
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        
        #loading {
            position: absolute; top: 50%; width: 100%; text-align: center; left: 0;
            color: #ffd700; font-size: 1.2rem; 
            text-shadow: 2px 2px 4px #000; transition: opacity 0.5s;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        }

        #error-console {
            position: absolute; top: 0; left: 0; width: 100%; background: rgba(50,0,0,0.8);
            color: #ffaaaa; font-family: monospace; font-size: 12px; padding: 10px;
            z-index: 9999; display: none; pointer-events: none; white-space: pre-wrap;
        }

        #result-text {
            position: absolute; top: 45%; width: 100%; text-align: center;
            color: #fff; font-size: 3rem; font-weight: bold;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #ffaa00; z-index: 300;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; transform: scale(0.8) translateY(-50%);
        }
        #result-text.show { opacity: 1; transform: scale(1) translateY(-50%); }

        /* Estilo Neón Violeta */
        #torres-info {
            position: absolute; top: 15vh; width: 100%; text-align: center;
            color: #e0b0ff; 
            font-size: 2rem; font-weight: bold; font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px #bc13fe, 0 0 20px #bc13fe;
            z-index: 20;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
            letter-spacing: 2px;
        }
        #torres-info.active { opacity: 1; }

        .icon-btn {
            position: absolute; z-index: 100;
            background: rgba(0,0,0,0.5); border: 2px solid #fff;
            color: #fff; border-radius: 50%; width: 50px; height: 50px;
            font-size: 24px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        #vr-btn { bottom: 20px; left: 20px; }
        #fs-manual-btn { top: 20px; right: 20px; font-size: 20px; }

        #landscape-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 999;
            display: none; 
            align-items: center; justify-content: center; flex-direction: column;
            color: #ffd700; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #landscape-overlay p { 
            font-size: 1.2rem; margin-bottom: 30px; text-transform: uppercase; 
            max-width: 16%; line-height: 1.5; color: #fff;
        }
        #enter-fs-btn {
              background: #ffd700; color: #000; border: none; padding: 20px 40px;
              font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer;
              text-transform: uppercase; box-shadow: 0 0 20px #ffd700;
              transition: transform 0.2s;
        }
        #enter-fs-btn:active { transform: scale(0.95); }
    </style>
    <script>
        window.onerror = function(msg, source, lineno, colno, error) {
            document.getElementById('error-console').style.display = 'block';
            document.getElementById('error-console').innerText += `Error: ${msg} (Line ${lineno})\n`;
        };
    </script>
</head>
<body>

    <div id="error-console"></div>
    <div id="loading">Cargando Recursos...</div>
    <div id="result-text">LISTO</div>
    <div id="torres-info">MODO TORRES: <span id="torres-count">0</span> SPINS</div>

    <button id="vr-btn" class="icon-btn" title="Modo VR">👓</button>
    <button id="fs-manual-btn" class="icon-btn" title="Pantalla Completa">⛶</button>

    <div id="landscape-overlay">
        <p>Para jugar en horizontal necesitamos ocultar la barra del navegador.</p>
        <button id="enter-fs-btn">MODO CINE</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { StereoEffect } from 'three/addons/effects/StereoEffect.js';
        
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // =====================================================================
        // 1. CONFIGURACIÓN
        // =====================================================================
        const loadingText = document.getElementById('loading');
        const resultText = document.getElementById('result-text');
        const torresInfo = document.getElementById('torres-info');
        const torresCountSpan = document.getElementById('torres-count');
        
        const CYLINDER_TARGET_WIDTH = 19.0;
        
        // CÁMARA NORMAL
        const CAM_LAND_DIST = 25.0;  
        const CAM_LAND_Y = 0.9;     
        const CAM_PORT_Y = 0.0; 
        const Z_VR = 42; 
        const Z_ZOOM = 14; 
        const TEXT_Z_POS = 15.0; 

        // CÁMARA TORRES
        const CAM_TORRES_X = 11.35;
        const CAM_TORRES_Y = 8.80;
        const CAM_TORRES_Z = 20.48;
        const CAM_TORRES_RX = -0.67;
        const CAM_TORRES_RY = 0.55;
        const CAM_TORRES_RZ = 0.40;

        const NUM_CARRETES = 3;
        const NUM_CAPAS = 3; 
        const SEPARACION_CARRETES = 4.5;
        const NUM_ITEMS_POR_RUEDA = 8;
        const RADIO_ORBITA_BASE = 6.0; 
        const SEPARACION_CAPAS = 2.5; 
        const ANGLE_STEP = (Math.PI * 2) / NUM_ITEMS_POR_RUEDA;
        
        const ARCHIVOS_GLB = ['noel.glb', 'sirena.glb', 'xic.glb', 'goku.glb', 'torre.glb'];
        const NOMBRES_SIMBOLOS = ['Noel', 'Sirena', 'Xic', 'Goku', 'Torre', 'Noel', 'Sirena', 'Xic']; 
        
        const config = {
            sunIntensity: 2.8, sunPosY: 30, sunPosZ: 20,
            fillIntensity: 2.62, fillColor: '#fffbca',
            btnHoverEmissive: 3.095, lightHoverInt: 213, lightClickInt: 2889, btnIdleEmissive: 0.3, lightIdleInt: 50,
            aoEnabled: false, aoRadius: 3.68, aoMinDist: 0.001, aoMaxDist: 0.08265,
            landscapeRotX: -0.1, portraitRotX: 0.0, camRotY: 0.0, camRotZ: 0.0
        };

        const CLICK_BTN_EMISSIVE = 20.0; 
        const COIN_COUNT = 150; 
        const SPARKLE_COUNT = 400;
        const DUST_COUNT = 1000; 
        const COIN_GRAVITY = 20.0; 
        const COIN_SCALE = 0.8;
        const SPAWN_Y = -25.0; 
        const SPAWN_Z = 12.0; 
        const MIN_APEX = 2.0; 
        const MAX_APEX = 5.0; 

        // =====================================================================
        // 2. ESCENA
        // =====================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        let activeCamera = camera;

        let targetX = 0; let targetY = CAM_LAND_Y; let targetZ = CAM_LAND_DIST;
        let targetRotX = config.landscapeRotX; let targetRotY = config.camRotY; let targetRotZ = config.camRotZ;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.toneMapping = THREE.NoToneMapping;
        document.body.appendChild(renderer.domElement);

        let composer, ssaoPass;
        function initPostProcessing() {
            if (!config.aoEnabled) { composer = null; return; }
            const size = renderer.getDrawingBufferSize(new THREE.Vector2());
            const renderTarget = new THREE.WebGLRenderTarget(size.width, size.height, { samples: 4, type: THREE.HalfFloatType });
            composer = new EffectComposer(renderer, renderTarget);
            const renderPass = new RenderPass(scene, activeCamera);
            composer.addPass(renderPass);
            ssaoPass = new SSAOPass(scene, activeCamera, window.innerWidth, window.innerHeight);
            ssaoPass.kernelRadius = config.aoRadius;
            ssaoPass.minDistance = config.aoMinDist;
            ssaoPass.maxDistance = config.aoMaxDist;
            ssaoPass.output = SSAOPass.OUTPUT.Default; 
            composer.addPass(ssaoPass);
            const outputPass = new OutputPass();
            composer.addPass(outputPass);
        }

        const effectVR = new StereoEffect(renderer);
        effectVR.eyeSeparation = 0.005;
        effectVR.setSize(window.innerWidth, window.innerHeight);

        const loader = new GLTFLoader();
        const textureLoader = new THREE.TextureLoader();
        const clock = new THREE.Clock();
        const reels = [];
        
        const reelStates = Array(NUM_CARRETES * NUM_CAPAS).fill(null).map(() => ({ mode: 'IDLE', velocity: 0, targetAngle: 0 }));
        const symbolMasters = {};
        
        const coinsData = [];
        const sparklesData = [];
        const dustData = [];
        
        let coinInstancedMesh;
        let sparkleInstancedMesh; 
        let dustInstancedMesh;
        
        let dummy = new THREE.Object3D();
        let colorDummy = new THREE.Color();
        
        let spinGroup = null; let structureGroup = null;      
        let spinButtonMesh = null, spinArrowMesh = null;
        let machineIsSpinning = false, isButtonDisabled = false, isZoomed = false, isVRMode = false;
        let buttonMixer = null, buttonAction = null;
        
        let winSequence = { active: false, startTime: 0 };
        let isRewardActive = false; 
        let spinCounter = 0;
        let wasHoveringState = false; 
        
        let isHovering = false; 

        let sunLight = null; let fillLight = null; let pointLight = null; 
        let shineLight = null; 
        let isLightFlashing = false;
        
        let resultGroup = null;
        let resultModel = null;
        
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        const overlay = document.getElementById('landscape-overlay');
        const enterFsBtn = document.getElementById('enter-fs-btn');
        const manualFsBtn = document.getElementById('fs-manual-btn');
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // --- VARIABLES MODO TORRES ---
        let isTorresActive = false;
        
        let torresState = {
            totalSpins: 6,
            spinsLeft: 0,
            currentLayer: 1, 
            lockedReels: [[false,false,false], [false,false,false], [false,false,false]], 
            baseSymbols: [null, null, null], 
            layer1Symbols: [null, null, null], 
            spinThreshold: 3 
        };

        // =====================================================================
        // 3. INICIALIZACIÓN
        // =====================================================================
        init();

        async function init() {
            try {
                loadingText.innerText = "Cargando Entorno...";
                const cubemapTexture = await new Promise((resolve, reject) => textureLoader.load('cubemap.jpg', resolve, undefined, reject));
                cubemapTexture.mapping = THREE.EquirectangularReflectionMapping;
                const pmremGenerator = new THREE.PMREMGenerator(renderer);
                pmremGenerator.compileEquirectangularShader();
                const envMap = pmremGenerator.fromEquirectangular(cubemapTexture).texture;
                scene.environment = envMap;
                cubemapTexture.dispose(); pmremGenerator.dispose();

                createLights();

                loadingText.innerText = "Cargando Texturas FX...";
                const sparkleTex = await safeLoadTexture('destello.webp');

                loadingText.innerText = "Cargando Modelos...";
                const uniqueFiles = [...new Set(ARCHIVOS_GLB)];
                for (const file of uniqueFiles) await safeLoadSymbol(file);
                await safeLoadStructure('cilindro.glb');
                await safeLoadCoins('moneda.glb');

                createParticleSystems(sparkleTex);

                loadingText.innerText = "Construyendo Slot...";
                for(let capa = 0; capa < NUM_CAPAS; capa++) {
                    for(let r = 0; r < NUM_CARRETES; r++) {
                        crearHilera(r, capa);
                    }
                }
                
                buildResultContainer(); 

                for(let i=0; i<COIN_COUNT; i++) { coinsData.push({ position: new THREE.Vector3(), velocity: new THREE.Vector3(), rotation: new THREE.Euler(), active: false, life: 0, offsetPhase: Math.random() * Math.PI * 2, spawnDelay: 0 }); }
                for(let i=0; i<SPARKLE_COUNT; i++) { sparklesData.push({ position: new THREE.Vector3(), originPos: new THREE.Vector3(), velocity: new THREE.Vector3(), active: false, delay: 0, life: 0, offsetPhase: Math.random() * Math.PI * 2, baseScale: 0.2 + Math.random() * 0.8, distCenter: 0, spawnDelay: 0 }); }
                for(let i=0; i<DUST_COUNT; i++) { dustData.push({ position: new THREE.Vector3(), originPos: new THREE.Vector3(), velocity: new THREE.Vector3(), active: false, delay: 0, life: 0, offsetPhase: Math.random() * Math.PI * 2, baseScale: 0.1 + Math.random() * 0.3, color: new THREE.Color(), distCenter: 0, spawnDelay: 0 }); }

                forceShadows(scene);
                if (coinInstancedMesh) { coinInstancedMesh.castShadow = false; coinInstancedMesh.receiveShadow = true; }
                if (sparkleInstancedMesh) { sparkleInstancedMesh.castShadow = false; sparkleInstancedMesh.receiveShadow = false; }
                if (dustInstancedMesh) { dustInstancedMesh.castShadow = false; dustInstancedMesh.receiveShadow = false; }

                initPostProcessing();

                loadingText.innerText = "Optimizando Gráficos...";
                if(resultGroup) { resultGroup.visible = true; resultGroup.position.set(0, 0, 500); }
                renderer.compile(scene, camera);
                if(resultGroup) { resultGroup.visible = false; resultGroup.position.set(0, CAM_LAND_Y, 40); }

                loadingText.style.display = 'none';
                window.addEventListener('resize', onWindowResize);
                window.addEventListener('pointerdown', onPointerDown);
                window.addEventListener('pointermove', onPointerMove);
                document.getElementById('vr-btn').addEventListener('click', toggleVR);
                enterFsBtn.addEventListener('click', requestFullscreen);
                manualFsBtn.addEventListener('click', toggleFullscreen);
                document.addEventListener('fullscreenchange', checkOrientation);
                document.addEventListener('webkitfullscreenchange', checkOrientation);
                onWindowResize(); 
                animate();
            } catch (err) {
                loadingText.innerText = "Error: " + err.message; console.error(err);
            }
        }

        async function safeLoadTexture(url) {
            return new Promise(resolve => {
                textureLoader.load(url, resolve, undefined, () => {
                    console.warn(`Textura ${url} no encontrada, usando fallback.`);
                    const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(32,32,15,0,Math.PI*2); ctx.fill();
                    const tex = new THREE.CanvasTexture(canvas);
                    resolve(tex);
                });
            });
        }

        function createParticleSystems(sparkleTex) {
            const sparkleMat = new THREE.MeshBasicMaterial({ map: sparkleTex, color: 0xffffff, transparent: true, opacity: 1.0, blending: THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide });
            const geoS = new THREE.PlaneGeometry(0.5, 0.5); 
            sparkleInstancedMesh = new THREE.InstancedMesh(geoS, sparkleMat, SPARKLE_COUNT);
            sparkleInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(sparkleInstancedMesh);
            
            const dustMat = new THREE.MeshBasicMaterial({ map: sparkleTex, color: 0xffffff, transparent: true, opacity: 1.0, blending: THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide });
            const geoD = new THREE.PlaneGeometry(0.4, 0.4); 
            dustInstancedMesh = new THREE.InstancedMesh(geoD, dustMat, DUST_COUNT);
            dustInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(dustInstancedMesh);

            dummy.scale.set(0,0,0); dummy.updateMatrix();
            for(let i=0; i<COIN_COUNT; i++) { if(coinInstancedMesh) coinInstancedMesh.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<SPARKLE_COUNT; i++) { sparkleInstancedMesh.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<DUST_COUNT; i++) { dustInstancedMesh.setMatrixAt(i, dummy.matrix); }
        }

        function buildResultContainer() {
            if (resultGroup) return; 
            resultGroup = new THREE.Group();
            const master = symbolMasters['noel.glb'];
            if(master) {
                resultModel = master.clone();
                resultModel.scale.set(1, 1, 1);
                resultGroup.add(resultModel);
            } else {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xffd700}));
                resultGroup.add(mesh);
            }
            shineLight = new THREE.PointLight(0xffffff, 150, 15);
            shineLight.position.set(-10, 0, 2); 
            resultGroup.add(shineLight);
            resultGroup.position.set(0, CAM_LAND_Y, 40); 
            resultGroup.visible = false;
            scene.add(resultGroup);
        }

        function forceShadows(parent) {
            parent.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true; child.receiveShadow = true;
                    if(child.material && (child.material.transparent || child.material.alphaTest > 0)) {
                        child.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: child.material.map, alphaTest: 0.5 });
                    }
                }
            });
        }

        function updateSunPos() { if(sunLight) sunLight.position.set(-10, config.sunPosY, config.sunPosZ); }
        function requestFullscreen() { const docEl = document.documentElement; const requestMethod = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen; if (requestMethod) { requestMethod.call(docEl).then(() => { overlay.style.display = 'none'; checkOrientation(); }).catch(e => { overlay.style.display = 'none'; }); } }
        function toggleFullscreen() { if (!document.fullscreenElement && !document.webkitFullscreenElement) { requestFullscreen(); } else { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } }

        async function safeLoadSymbol(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => { symbolMasters[file] = gltf.scene; resolve(); }, undefined, () => {
                    const color = file === 'torre.glb' ? 0x9932CC : Math.random() * 0xffffff;
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: color}));
                    mesh.material.transparent = true; 
                    const g = new THREE.Group(); g.add(mesh); symbolMasters[file] = g; resolve();
                });
            });
        }

        async function safeLoadStructure(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => {
                    setupStructure(gltf.scene);
                    if(gltf.animations.length) {
                        buttonMixer = new THREE.AnimationMixer(gltf.scene);
                        buttonAction = buttonMixer.clipAction(gltf.animations[0]);
                        buttonAction.loop = THREE.LoopOnce; buttonAction.clampWhenFinished = true;
                    }
                    scene.add(gltf.scene); resolve();
                }, undefined, () => resolve());
            });
        }

        async function safeLoadCoins(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => {
                    let geo, mat;
                    gltf.scene.traverse(n => { if(n.isMesh){ geo = n.geometry; mat = n.material; } });
                    createCoinMesh(geo, mat); resolve();
                }, undefined, () => {
                    const geo = new THREE.CylinderGeometry(0.5,0.5,0.1,8);
                    const mat = new THREE.MeshStandardMaterial({color:0xffd700});
                    createCoinMesh(geo, mat); resolve();
                });
            });
        }

        function createCoinMesh(geo, mat) {
            coinInstancedMesh = new THREE.InstancedMesh(geo, mat, COIN_COUNT);
            coinInstancedMesh.castShadow = false; coinInstancedMesh.receiveShadow = true;
            for(let i=0; i<COIN_COUNT; i++) { dummy.scale.set(0,0,0); dummy.updateMatrix(); coinInstancedMesh.setMatrixAt(i, dummy.matrix); }
            coinInstancedMesh.instanceMatrix.needsUpdate = true; scene.add(coinInstancedMesh);
        }

        function createLights() {
            const amb = new THREE.AmbientLight(0xffffff, 0.6); scene.add(amb);
            sunLight = new THREE.DirectionalLight(0xfffee0, config.sunIntensity);
            sunLight.position.set(-10, config.sunPosY, config.sunPosZ);
            sunLight.castShadow = true; 
            sunLight.target.position.set(0, 0, 0); scene.add(sunLight.target);
            sunLight.shadow.mapSize.set(1024, 1024);
            const d = 30; sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d; sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005; sunLight.shadow.normalBias = 0.02; scene.add(sunLight);

            const fillPivot = new THREE.Object3D(); fillPivot.rotation.set(-3.06, -1.36, -2.31); scene.add(fillPivot);
            fillLight = new THREE.DirectionalLight(config.fillColor, config.fillIntensity);
            fillLight.position.set(-8.10, -4.57, -7.28); fillPivot.add(fillLight);

            pointLight = new THREE.PointLight(0xffaa00, 0, 100);
            pointLight.position.set(0, -5, 16);
            pointLight.castShadow = true;
            pointLight.shadow.bias = -0.0001; pointLight.shadow.normalBias = 0.02; 
            pointLight.shadow.mapSize.width = 1024; pointLight.shadow.mapSize.height = 1024;
            pointLight.shadow.camera.near = 0.1; scene.add(pointLight);
        }

        function setupStructure(node) {
            structureGroup = node;
            if (node.name.toLowerCase() === 'spin') {
                spinGroup = node;
                node.traverse((child) => { if (child.isMesh) { child.material = child.material.clone(); child.userData.origColor = child.material.color.clone(); if(child.name.includes('arrow')) spinArrowMesh = child; else spinButtonMesh = child; } });
            }
        }

        function crearHilera(index, capaIndex) {
            const reelGroup = new THREE.Group();
            reelGroup.position.x = (index * SEPARACION_CARRETES) - ((NUM_CARRETES - 1) * SEPARACION_CARRETES / 2);
            scene.add(reelGroup); reels.push(reelGroup);
            const radioActual = RADIO_ORBITA_BASE + (capaIndex * SEPARACION_CAPAS);

            if (capaIndex > 0) { reelGroup.visible = false; }

            for (let i = 0; i < NUM_ITEMS_POR_RUEDA; i++) {
                const glbName = ARCHIVOS_GLB[i % ARCHIVOS_GLB.length]; 
                let master = symbolMasters[glbName];
                if (!master) {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color:0xff0000}));
                    master = new THREE.Group(); master.add(m);
                }
                const model = master.clone();
                model.traverse(child => {
                    if (child.isMesh) {
                        child.material = child.material.clone();
                        // 1. TRANSPARENCIA SIEMPRE ACTIVADA PARA EVITAR CRASHEOS
                        child.material.transparent = true; 
                        child.material.opacity = 1.0; 
                        // Para que las sombras funcionen bien con transparencia
                        child.material.alphaTest = 0.5; 
                        child.userData.originalColor = child.material.color.clone();
                        child.userData.fadeLevel = 1.0; // Control interno de opacidad
                        child.userData.isFading = false;
                    }
                });
                const pivot = new THREE.Group(); pivot.rotation.x = (i * ANGLE_STEP);
                model.position.set(0, 0, radioActual); pivot.add(model); reelGroup.add(pivot);
            }
        }

        function toggleVR() { isVRMode = !isVRMode; if (isVRMode) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); activeCamera = camera; } else { if (document.exitFullscreen) document.exitFullscreen(); onWindowResize(); } adjustCameraTarget(); }
        function onWindowResize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h); if(composer) { composer.setSize(w, h); } effectVR.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); checkOrientation(); adjustCameraTarget(); }
        function checkOrientation() { if (!isMobile) return; const isLandscape = window.innerWidth > window.innerHeight; const isFS = document.fullscreenElement || document.webkitFullscreenElement; if (isLandscape && !isFS) overlay.style.display = 'flex'; else overlay.style.display = 'none'; }
        
        function adjustCameraTarget() { 
            const aspect = window.innerWidth / window.innerHeight; 
            if (isTorresActive) {
                targetX = CAM_TORRES_X; targetY = CAM_TORRES_Y; targetZ = CAM_TORRES_Z;
                targetRotX = CAM_TORRES_RX; targetRotY = CAM_TORRES_RY; targetRotZ = CAM_TORRES_RZ;
            } else {
                if (aspect >= 1.0) { camera.fov = 40; targetZ = CAM_LAND_DIST; targetY = CAM_LAND_Y; targetRotX = config.landscapeRotX; } 
                else { camera.fov = 75; targetZ = (CYLINDER_TARGET_WIDTH / 2.0) / (aspect * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2.0))); targetY = CAM_PORT_Y; targetRotX = config.portraitRotX; } 
                targetRotY = config.camRotY; targetRotZ = config.camRotZ; targetX = 0.0; 
                if (isVRMode) { targetZ = Z_VR; targetY = 0; targetX = 0; targetRotX = 0; } 
                else if (isZoomed) { targetZ = Z_ZOOM; targetY = (aspect >= 1.0) ? CAM_LAND_Y : CAM_PORT_Y; targetRotX = (aspect >= 1.0) ? config.landscapeRotX : config.portraitRotX; targetX = 0; } 
            }
            camera.updateProjectionMatrix(); 
        }

        // --- LÓGICA DE JUEGO (BASE + TORRES) ---
        function spinMachine() {
            if (machineIsSpinning || isButtonDisabled) return;
            machineIsSpinning = true; isButtonDisabled = true; isZoomed = false;
            adjustCameraTarget(); resetCoinsAndFX();
            resultText.classList.remove('show');
            if (resultGroup) { resultGroup.visible = false; }
            if(buttonAction) { buttonAction.reset(); buttonAction.play(); }
            isLightFlashing = true; setTimeout(() => isLightFlashing = false, 200);
            spinCounter++; 
            
            // Si por alguna razón el flag seguía activo (seguridad), limpiar.
            // Nota: En la V98 la limpieza principal es en endTorresMode/updateSequence
            if (isTorresActive) {
                isTorresActive = false;
                torresInfo.classList.remove('active');
                cleanupTorresVisuals();
            }

            reelStates.forEach((s, idx) => {
                s.mode = 'SPINNING'; s.velocity = 0; 
                // Reset fade flags
                const r = reels[idx];
                r.children.forEach(p => { p.children[0].traverse(c => { 
                    if(c.isMesh) { c.userData.isFading = false; c.userData.fadeLevel = 1.0; }
                }); });
            });
            
            const forceWin = false; 
            const TOTAL_REELS = NUM_CARRETES * NUM_CAPAS;
            for (let i = 0; i < TOTAL_REELS; i++) setTimeout(() => {
                const state = reelStates[i]; state.mode = 'STOPPING';
                const currentRot = reels[i].rotation.x; 
                const nextRound = Math.ceil(currentRot / (Math.PI*2)) + 2 + (i % 3);
                let randIndex; if (forceWin) { randIndex = 0; } else { randIndex = Math.floor(Math.random() * NUM_ITEMS_POR_RUEDA); }
                state.targetAngle = (nextRound * Math.PI * 2) + (randIndex * ANGLE_STEP);
            }, 200 + ((i % 3) * 600)); 
        }

        function checkResults() {
             const resultIndices = [reels[0], reels[1], reels[2]].map(r => { let ang = r.rotation.x % (Math.PI*2); if(ang < 0) ang += Math.PI*2; return Math.round(ang / ANGLE_STEP) % NUM_ITEMS_POR_RUEDA; });
             const names = resultIndices.map(i => NOMBRES_SIMBOLOS[(NUM_ITEMS_POR_RUEDA - i) % NUM_ITEMS_POR_RUEDA]);
             torresState.baseSymbols = [...names];
             const hasTorre = names.includes('Torre');
             if (hasTorre) { startTorresMode(); } 
             else if(names[0] === names[1] && names[1] === names[2]) { triggerWin(names); } 
             else { resultText.innerText = names.join(" - "); resultText.classList.add('show'); isButtonDisabled = false; }
        }

        function triggerWin(names) {
            if(resultGroup) { resultGroup.visible = true; resultGroup.position.set(0, activeCamera.position.y, activeCamera.position.z + 20); }
            isButtonDisabled = true; isRewardActive = true;
            winSequence.active = true; winSequence.startTime = clock.getElapsedTime(); spawnCoins();
        }

        // --- LÓGICA TORRES ---
        function startTorresMode() {
            isTorresActive = true; isButtonDisabled = true;
            torresState.totalSpins = 6; torresState.spinsLeft = torresState.totalSpins; torresState.currentLayer = 1; torresState.spinThreshold = torresState.totalSpins / 2;
            torresState.lockedReels = [[true, true, true], [false, false, false], [false, false, false]];
            torresState.layer1Symbols = [null, null, null];
            torresInfo.classList.add('active'); torresCountSpan.innerText = torresState.spinsLeft;
            toggleLayerVisibility(1, true); adjustCameraTarget();
            setTimeout(spinTorresLoop, 1500); 
        }

        function toggleLayerVisibility(layerIdx, isVisible) {
            const startIdx = layerIdx * NUM_CARRETES;
            for(let i=0; i<NUM_CARRETES; i++) { reels[startIdx + i].visible = isVisible; }
        }

        function cleanupTorresVisuals() {
            // Ocultar capas 1 y 2
            for(let i=3; i<9; i++) {
                if(reels[i]) reels[i].visible = false;
            }
            adjustCameraTarget();
        }

        function spinTorresLoop() {
            torresCountSpan.innerText = torresState.spinsLeft;
            if (torresState.spinsLeft <= 0 || torresState.currentLayer > 2) { endTorresMode(); return; }

            const layerIdx = torresState.currentLayer;
            toggleLayerVisibility(layerIdx, true);
            const reelsStartIndex = layerIdx * NUM_CARRETES; 
            let activeReelsCount = 0;

            for (let i = 0; i < 3; i++) {
                // Si el rodillo YA está bloqueado, no lo giramos
                if (torresState.lockedReels[layerIdx][i]) continue;

                // Si estamos en Capa 2 y la Capa 1 NO tiene bloque, este rodillo NO gira y NO se ve
                if (layerIdx === 2 && !torresState.lockedReels[1][i]) {
                    reels[reelsStartIndex + i].visible = false; 
                    continue; 
                }

                // Rodillo activo
                reels[reelsStartIndex + i].visible = true; 
                const globalIndex = reelsStartIndex + i;
                const r = reels[globalIndex];
                
                // Reiniciar opacidad
                r.children.forEach(p => { p.children[0].traverse(c => { 
                    if(c.isMesh) { c.userData.isFading = false; c.userData.fadeLevel = 1.0; }
                }); });

                reelStates[globalIndex].mode = 'SPINNING';
                reelStates[globalIndex].velocity = 0; 
                activeReelsCount++;
            }

            if (activeReelsCount === 0) {
                if (torresState.currentLayer === 1) { 
                    // Verificar si pasamos a Capa 2
                    const lockedCountL1 = torresState.lockedReels[1].filter(Boolean).length;
                    if (lockedCountL1 === 0) { endTorresMode(); return; }
                    torresState.currentLayer = 2; 
                    spinTorresLoop(); 
                } else { 
                    endTorresMode(); 
                }
                return;
            }

            setTimeout(() => {
                for (let i = 0; i < 3; i++) {
                    const globalIndex = reelsStartIndex + i;
                    if (reelStates[globalIndex].mode === 'SPINNING') {
                        const state = reelStates[globalIndex];
                        state.mode = 'STOPPING';
                        const currentRot = reels[globalIndex].rotation.x;
                        const nextRound = Math.ceil(currentRot / (Math.PI*2)) + 1;
                        const randIndex = Math.floor(Math.random() * NUM_ITEMS_POR_RUEDA);
                        state.targetAngle = (nextRound * Math.PI * 2) + (randIndex * ANGLE_STEP);
                    }
                }
                setTimeout(evaluateTorresSpin, 1500); 
            }, 1000);
            torresState.spinsLeft--;
        }

        function evaluateTorresSpin() {
            const layerIdx = torresState.currentLayer;
            const reelsStartIndex = layerIdx * NUM_CARRETES;
            const currentSymbols = [];
            for(let i=0; i<3; i++) {
                const r = reels[reelsStartIndex + i];
                let ang = r.rotation.x % (Math.PI*2); if(ang < 0) ang += Math.PI*2;
                const idx = Math.round(ang / ANGLE_STEP) % NUM_ITEMS_POR_RUEDA;
                currentSymbols.push(NOMBRES_SIMBOLOS[(NUM_ITEMS_POR_RUEDA - idx) % NUM_ITEMS_POR_RUEDA]);
            }
            const targetSymbols = (layerIdx === 1) ? torresState.baseSymbols : torresState.layer1Symbols;
            let matchCount = 0;
            
            for (let i = 0; i < 3; i++) {
                if (torresState.lockedReels[layerIdx][i]) { matchCount++; continue; }
                if (layerIdx === 2 && !torresState.lockedReels[1][i]) continue;

                if (currentSymbols[i] === targetSymbols[i]) {
                    torresState.lockedReels[layerIdx][i] = true; matchCount++;
                } else {
                    const globalIndex = reelsStartIndex + i;
                    markReelSymbolForFade(reels[globalIndex]);
                }
            }
            if (layerIdx === 1) { torresState.layer1Symbols = [...currentSymbols]; }
            
            const lockedCount = torresState.lockedReels[layerIdx].filter(Boolean).length;
            let halfSpinsUsed = (torresState.spinsLeft <= torresState.spinThreshold);

            if (layerIdx === 1) {
                if (lockedCount === 3 || halfSpinsUsed) {
                     if (lockedCount === 0) { endTorresMode(); return; }
                     torresState.currentLayer = 2; 
                }
            }
            setTimeout(spinTorresLoop, 500);
        }

        function markReelSymbolForFade(reelGroup) {
            const reelAngle = reelGroup.rotation.x;
            reelGroup.children.forEach(pivot => {
                let angle = (reelAngle + pivot.rotation.x) % (Math.PI * 2);
                if (angle < 0) angle += Math.PI*2;
                if (angle < 0.1 || angle > 6.18) {
                    pivot.children[0].traverse(c => {
                        if (c.isMesh) c.userData.isFading = true;
                    });
                }
            });
        }

        function endTorresMode() {
            // NOTA: No seteamos isTorresActive = false aquí inmediatamente
            // para que los efectos visuales (transparencia) se mantengan durante el mensaje.
            
            let l1Full = torresState.lockedReels[1].every(v => v);
            let l2Full = torresState.lockedReels[2].every(v => v);
            let multiplier = l2Full ? 3 : (l1Full ? 2 : 1);
            if (multiplier > 1) { 
                resultText.innerText = `¡TORRE COMPLETADA x${multiplier}!`; 
                resultText.classList.add('show'); 
                triggerWin(['Torre']); 
            } else { 
                resultText.innerText = "FIN MODO TORRES"; 
                resultText.classList.add('show'); 
                
                // Esperar 3 segundos mostrando el mensaje y la torre
                setTimeout(() => { 
                    // AHORA SÍ, limpieza total sincronizada
                    isTorresActive = false; 
                    resultText.classList.remove('show'); 
                    torresInfo.classList.remove('active'); 
                    isButtonDisabled = false; 
                    cleanupTorresVisuals();
                }, 3000); 
            }
        }

        // =====================================================================
        // EVENTOS Y FX
        // =====================================================================
        function onPointerMove(e) { pointer.x = (e.clientX / window.innerWidth) * 2 - 1; pointer.y = - (e.clientY / window.innerHeight) * 2 + 1; if (!isButtonDisabled && (spinGroup || structureGroup)) { raycaster.setFromCamera(pointer, activeCamera); let hit = false; if (spinGroup && raycaster.intersectObject(spinGroup, true).length > 0) hit = true; else if (structureGroup && raycaster.intersectObject(structureGroup, true).length > 0) hit = true; isHovering = hit; document.body.style.cursor = hit ? 'pointer' : 'default'; } else { isHovering = false; document.body.style.cursor = 'default'; } }
        function onPointerDown(e) { if (e.target.tagName === 'BUTTON') return; if (isButtonDisabled) return; pointer.x = (e.clientX / window.innerWidth) * 2 - 1; pointer.y = - (e.clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(pointer, activeCamera); let hit = false; if (spinGroup && raycaster.intersectObject(spinGroup, true).length > 0) hit = true; if (!hit && structureGroup && raycaster.intersectObject(structureGroup, true).length > 0) hit = true; if (hit) spinMachine(); }
        function spawnCoins() { const textCenterY = activeCamera.position.y; for(let i=0; i < COIN_COUNT; i++) { const data = coinsData[i]; data.active = true; data.life = 10.0 + Math.random(); data.spawnDelay = Math.random() * 0.1; const height = (MIN_APEX + Math.random() * (MAX_APEX - MIN_APEX)) - SPAWN_Y; const v0 = Math.sqrt(2 * COIN_GRAVITY * height); data.position.set((Math.random() - 0.5) * 15.0, SPAWN_Y, SPAWN_Z + (Math.random() * 4.0)); data.velocity.set((Math.random() - 0.5) * 8.0, v0 + (Math.random() * 2.0), (Math.random() - 0.5) * 4.0); data.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI); } }
        function resetCoinsAndFX() { if (!coinInstancedMesh) return; dummy.scale.set(0,0,0); dummy.updateMatrix(); for(let i=0; i < COIN_COUNT; i++) { coinsData[i].active = false; coinInstancedMesh.setMatrixAt(i, dummy.matrix); } coinInstancedMesh.instanceMatrix.needsUpdate = true; /* rest of FX reset omitted for brevity */ }

        function updateSequence(time) {
            if (!winSequence.active) {
                if(shineLight) shineLight.position.set(0,50,0);
                return;
            }
            const elapsed = time - winSequence.startTime;
            if (elapsed >= 1.5) {
                if (!resultGroup.visible) {
                    resultGroup.visible = true;
                    resultGroup.position.set(0, activeCamera.position.y, activeCamera.position.z + 20);
                }
                const textTime = elapsed - 1.5;
                const baseZ = TEXT_Z_POS;
                const startZ = activeCamera.position.z + 20;
                if (textTime < 1.0) {
                     const p = textTime / 1.0;
                     const c1 = 1.70158; const c3 = c1 + 1;
                     const ease = 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
                     resultGroup.position.z = startZ - (startZ - baseZ) * ease;
                } else if (textTime < 2.5) {
                     const driftP = (textTime - 1.0) / 1.5;
                     const drift = Math.sin(driftP * Math.PI * 0.5) * 2.0; 
                     resultGroup.position.z = baseZ + drift;
                } else {
                     const exitTime = textTime - 2.5;
                     const accel = exitTime * exitTime * 50.0;
                     resultGroup.position.z = (baseZ + 2.0) + accel;
                }
                if (shineLight && textTime < 2.5) {
                     const sweep = Math.sin(time * 3.0) * 10.0;
                     shineLight.position.set(sweep, 0, 5.0);
                } else if (shineLight) {
                     shineLight.position.set(0,50,0);
                }
            }
            if (elapsed > 5.0) {
                winSequence.active = false;
                isButtonDisabled = false; isRewardActive = false;
                if(resultGroup) { resultGroup.visible = false; }
                resetCoinsAndFX();
                
                // LIMPIEZA FINAL SI ESTÁBAMOS EN TORRES (Caso de Victoria)
                if (isTorresActive) {
                    isTorresActive = false;
                    cleanupTorresVisuals();
                    torresInfo.classList.remove('active');
                }
            }
        }

        function updateSymbolVisibility() {
            reels.forEach((reelGroup) => {
                const reelAngle = reelGroup.rotation.x;
                reelGroup.children.forEach((pivotGroup) => {
                    const symbolAngle = pivotGroup.rotation.x; 
                    let totalAngle = (reelAngle + symbolAngle) % (Math.PI * 2); if(totalAngle < 0) totalAngle += (Math.PI * 2);
                    const cosA = Math.cos(totalAngle);
                    
                    const symbolWrapper = pivotGroup.children[0]; 
                    if (symbolWrapper) {
                        symbolWrapper.traverse((child) => {
                            if (child.isMesh && child.material && child.userData.originalColor) {
                                let brightness = (cosA > 0) ? Math.pow(cosA, 0.5) : 0.05;
                                let rowOpacity = 1.0; 

                                if (isTorresActive) {
                                    // REGLA 1: Filas superior/inferior al 15%
                                    if (cosA < 0.95) rowOpacity = 0.15; 

                                    // REGLA 2: FADE OUT (Animación)
                                    if (child.userData.isFading) {
                                        child.userData.fadeLevel = Math.max(0, child.userData.fadeLevel - 0.05); // Bajar 5% por frame
                                    }
                                } else {
                                    // Resetear en modo normal
                                    child.userData.fadeLevel = 1.0;
                                }

                                // Combinar opacidades
                                let finalOpacity = rowOpacity * child.userData.fadeLevel;
                                
                                // Aplicar
                                child.material.opacity = finalOpacity;
                                // Ajuste fino del AlphaTest para evitar artefactos negros si es muy transparente
                                child.material.alphaTest = (finalOpacity < 0.01) ? 0 : 0.5;
                                
                                child.material.color.copy(child.userData.originalColor).multiplyScalar(brightness);
                            }
                        });
                    }
                });
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();
            const timeScale = delta * 60;

            if(buttonMixer) buttonMixer.update(delta);
            updateSequence(time); 
            if(coinInstancedMesh) { /* Update coins logic here same as before */ } 
            
            updateSymbolVisibility();

            let allIdle = true;
            reels.forEach((r, i) => {
                const s = reelStates[i];
                if(s.mode === 'SPINNING') { 
                    allIdle = false; if(s.velocity < 0.5) s.velocity += 0.02 * timeScale; r.rotation.x += s.velocity * timeScale; 
                } else if(s.mode === 'STOPPING') { 
                    allIdle = false; const diff = s.targetAngle - r.rotation.x; s.velocity += diff * 0.25 * timeScale; s.velocity *= Math.pow(0.80, timeScale); r.rotation.x += s.velocity * timeScale; 
                    if(Math.abs(diff) < 0.005 && Math.abs(s.velocity) < 0.005) { r.rotation.x = s.targetAngle; s.mode = 'IDLE'; } 
                }
            });
            
            if(allIdle && machineIsSpinning) { 
                machineIsSpinning = false; 
                // Solo chequear resultados si NO estamos en Torres (el loop de torres se autogestiona)
                if (!isTorresActive) { checkResults(); }
            }

            if (sunLight) sunLight.intensity += (config.sunIntensity - sunLight.intensity) * 0.1;

            activeCamera.position.x += (targetX - activeCamera.position.x) * 0.05 * timeScale;
            activeCamera.position.z += (targetZ - activeCamera.position.z) * 0.05 * timeScale;
            activeCamera.position.y += (targetY - activeCamera.position.y) * 0.05 * timeScale;
            
            activeCamera.rotation.x += (targetRotX - activeCamera.rotation.x) * 0.05 * timeScale;
            activeCamera.rotation.y += (targetRotY - activeCamera.rotation.y) * 0.05 * timeScale;
            activeCamera.rotation.z += (targetRotZ - activeCamera.rotation.z) * 0.05 * timeScale;

            if(isVRMode) effectVR.render(scene, activeCamera);
            else if (config.aoEnabled && composer) composer.render();
            else renderer.render(scene, activeCamera);
        }
    </script>
