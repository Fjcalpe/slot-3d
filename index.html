<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Slot Pro: Full Content</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #000; 
            font-family: 'Segoe UI', sans-serif; touch-action: none; 
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        
        #loading {
            position: absolute; top: 50%; width: 100%; text-align: center; left: 0;
            color: #ffd700; font-size: 1.2rem; 
            text-shadow: 2px 2px 4px #000; transition: opacity 0.5s;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        }

        #result-text {
            position: absolute; top: 15vh; width: 100%; text-align: center;
            color: #fff; font-size: 2rem; font-weight: bold;
            text-shadow: 0 0 15px #ffd700; z-index: 20;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; transform: scale(0.8);
        }
        #result-text.show { opacity: 1; transform: scale(1); }

        .icon-btn {
            position: absolute; z-index: 100;
            background: rgba(0,0,0,0.5); border: 2px solid #fff;
            color: #fff; border-radius: 50%; width: 50px; height: 50px;
            font-size: 24px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        #vr-btn { bottom: 20px; left: 20px; }
        #fs-manual-btn { top: 20px; right: 20px; font-size: 20px; }

        #landscape-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 999;
            display: none; 
            align-items: center; justify-content: center; flex-direction: column;
            color: #ffd700; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #landscape-overlay p { 
            font-size: 1.2rem; margin-bottom: 30px; text-transform: uppercase; 
            max-width: 80%; line-height: 1.5; color: #fff;
        }
        #enter-fs-btn {
              background: #ffd700; color: #000; border: none; padding: 20px 40px;
              font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer;
              text-transform: uppercase; box-shadow: 0 0 20px #ffd700;
              transition: transform 0.2s;
        }
        #enter-fs-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="loading">Cargando Recursos...</div>
    <div id="result-text">LISTO</div>

    <button id="vr-btn" class="icon-btn" title="Modo VR">👓</button>
    <button id="fs-manual-btn" class="icon-btn" title="Pantalla Completa">⛶</button>

    <div id="landscape-overlay">
        <p>Para jugar en horizontal necesitamos ocultar la barra del navegador.</p>
        <button id="enter-fs-btn">MODO CINE</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { StereoEffect } from 'three/addons/effects/StereoEffect.js';

        // =====================================================================
        // 1. CONFIGURACIÓN
        // =====================================================================
        const loadingText = document.getElementById('loading');
        const resultText = document.getElementById('result-text');
        
        // --- CONSTANTES DE ENCUADRE ---
        const MACHINE_WIDTH_FACTOR = 17.5; 
        
        const CAM_LAND_DIST = 25.0;  
        const CAM_LAND_Y = -2.0;
        const CAM_LAND_X = 0.0;     
        
        const CAM_PORT_Y = -4.5;
        const CAM_PORT_X = 1.2;      
        
        const Z_VR = 42; 
        const Z_ZOOM = 14; 

        const NUM_CARRETES = 3;
        const SEPARACION_CARRETES = 4.5;
        const NUM_ITEMS_POR_RUEDA = 8;
        const RADIO_ORBITA_SIMBOLOS = 6.0;
        const ANGLE_STEP = (Math.PI * 2) / NUM_ITEMS_POR_RUEDA;
        
        // --- RESTAURADOS LOS MODELOS ORIGINALES ---
        const ARCHIVOS_GLB = ['noel.glb', 'sirena.glb', 'xic.glb', 'goku.glb'];
        const NOMBRES_SIMBOLOS = ['Noel', 'Sirena', 'Xic', 'Goku', 'Noel', 'Sirena', 'Xic', 'Goku'];
        
        const params = { btnColor: "#ffffff", btnClick: 20.8, arrColor: "#fff68f", arrClick: 14.8 };

        const COIN_COUNT = 150; 
        const COIN_GRAVITY = 25.0; const COIN_BLAST_FORCE = 20; const COIN_SPREAD = 10.0; const COIN_SCALE = 0.8;

        // =====================================================================
        // 2. ESCENA Y RENDERER
        // =====================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const cameraLandscape = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 150);
        const cameraPortrait = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 150);
        let activeCamera = cameraLandscape; 

        let targetX = 0;
        let targetY = CAM_LAND_Y;
        let targetZ = CAM_LAND_DIST;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap; 
        document.body.appendChild(renderer.domElement);

        const effectVR = new StereoEffect(renderer);
        effectVR.eyeSeparation = 0.005;
        effectVR.setSize(window.innerWidth, window.innerHeight);

        // Variables Globales
        const loader = new GLTFLoader();
        const textureLoader = new THREE.TextureLoader();
        const clock = new THREE.Clock();
        const reels = [];
        const reelStates = Array(NUM_CARRETES).fill(null).map(() => ({ mode: 'IDLE', velocity: 0, targetAngle: 0 }));
        const symbolMasters = {};
        const coinsData = [];
        let coinInstancedMesh, dummy = new THREE.Object3D();
        
        let spinGroup = null;          
        let structureGroup = null;     
        
        let spinButtonMesh = null, spinArrowMesh = null;
        let machineIsSpinning = false, isButtonDisabled = false, isZoomed = false, isVRMode = false;
        let buttonMixer = null, buttonAction = null;
        let pointLight = null, isLightFlashing = false;

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        // DOM Elements
        const overlay = document.getElementById('landscape-overlay');
        const enterFsBtn = document.getElementById('enter-fs-btn');
        const manualFsBtn = document.getElementById('fs-manual-btn');
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // =====================================================================
        // 3. INICIALIZACIÓN
        // =====================================================================
        init();

        async function init() {
            try {
                loadingText.innerText = "Cargando Entorno...";
                
                const cubemapTexture = await new Promise((resolve, reject) => textureLoader.load('cubemap.jpg', resolve, undefined, reject));
                cubemapTexture.mapping = THREE.EquirectangularReflectionMapping;
                const pmremGenerator = new THREE.PMREMGenerator(renderer);
                pmremGenerator.compileEquirectangularShader();
                scene.environment = pmremGenerator.fromEquirectangular(cubemapTexture).texture;
                cubemapTexture.dispose(); pmremGenerator.dispose();

                createLights();

                loadingText.innerText = "Cargando Modelos...";
                
                // --- LÓGICA PARA CARGAR TODOS LOS MODELOS ÚNICOS ---
                const uniqueFiles = [...new Set(ARCHIVOS_GLB)];
                for (const file of uniqueFiles) {
                    await safeLoadSymbol(file);
                }

                await safeLoadStructure('cilindro.glb');
                await safeLoadCoins('moneda.glb');

                loadingText.innerText = "Construyendo Slot...";
                for(let r = 0; r < NUM_CARRETES; r++) crearHilera(r);

                for(let i=0; i<COIN_COUNT; i++) coinsData.push({ position: new THREE.Vector3(), velocity: new THREE.Vector3(), rotation: new THREE.Euler(), rotSpeed: new THREE.Vector3(), active: false });

                loadingText.style.display = 'none';
                
                window.addEventListener('resize', onWindowResize);
                window.addEventListener('pointerdown', onPointerDown);
                
                document.getElementById('vr-btn').addEventListener('click', toggleVR);
                enterFsBtn.addEventListener('click', requestFullscreen);
                manualFsBtn.addEventListener('click', toggleFullscreen);
                
                document.addEventListener('fullscreenchange', checkOrientation);
                document.addEventListener('webkitfullscreenchange', checkOrientation);

                onWindowResize(); 
                animate();

            } catch (err) {
                loadingText.innerText = "Error: " + err.message;
                console.error(err);
            }
        }

        function requestFullscreen() {
            const docEl = document.documentElement;
            const requestMethod = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
            if (requestMethod) {
                requestMethod.call(docEl).then(() => { overlay.style.display = 'none'; checkOrientation(); }).catch(e => { overlay.style.display = 'none'; });
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        async function safeLoadSymbol(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => {
                    symbolMasters[file] = gltf.scene;
                    resolve();
                }, undefined, () => {
                    // Fallback visual si falta el archivo
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: Math.random() * 0xffffff}));
                    const g = new THREE.Group(); g.add(mesh);
                    symbolMasters[file] = g;
                    resolve();
                });
            });
        }

        async function safeLoadStructure(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => {
                    setupStructure(gltf.scene);
                    if(gltf.animations.length) {
                        buttonMixer = new THREE.AnimationMixer(gltf.scene);
                        buttonAction = buttonMixer.clipAction(gltf.animations[0]);
                        buttonAction.loop = THREE.LoopOnce; buttonAction.clampWhenFinished = true;
                    }
                    scene.add(gltf.scene);
                    resolve();
                }, undefined, () => resolve());
            });
        }

        async function safeLoadCoins(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => {
                    let geo, mat;
                    gltf.scene.traverse(n => { if(n.isMesh){ geo = n.geometry; mat = n.material; } });
                    if(mat) mat.emissive = new THREE.Color(0xffaa00);
                    createCoinMesh(geo, mat);
                    resolve();
                }, undefined, () => {
                    const geo = new THREE.CylinderGeometry(0.5,0.5,0.1,8);
                    const mat = new THREE.MeshStandardMaterial({color:0xffd700});
                    createCoinMesh(geo, mat);
                    resolve();
                });
            });
        }

        function createCoinMesh(geo, mat) {
            coinInstancedMesh = new THREE.InstancedMesh(geo, mat, COIN_COUNT);
            coinInstancedMesh.castShadow = false; 
            coinInstancedMesh.receiveShadow = true;
            for(let i=0; i<COIN_COUNT; i++) { dummy.scale.set(0,0,0); dummy.updateMatrix(); coinInstancedMesh.setMatrixAt(i, dummy.matrix); }
            coinInstancedMesh.instanceMatrix.needsUpdate = true;
            scene.add(coinInstancedMesh);
        }

        function createLights() {
            const amb = new THREE.AmbientLight(0xffffff, 0.6); 
            scene.add(amb);
            
            const sun = new THREE.DirectionalLight(0xfffee0, 3.0);
            sun.position.set(-10, 30, 20);
            sun.castShadow = true;
            sun.shadow.mapSize.set(1024, 1024); 
            const d = 14; 
            sun.shadow.camera.left = -d; sun.shadow.camera.right = d; 
            sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
            sun.shadow.bias = -0.001;
            scene.add(sun);

            const fillPivot = new THREE.Object3D();
            fillPivot.rotation.set(-3.06, -1.36, -2.31);
            scene.add(fillPivot);
            const fillLight = new THREE.DirectionalLight("#fffee0", 2.0);
            fillLight.position.set(-8.10, -4.57, -7.28);
            fillPivot.add(fillLight);

            pointLight = new THREE.PointLight(0xffaa00, 0, 100);
            pointLight.position.set(0, -5, 12);
            scene.add(pointLight);
        }

        function setupStructure(node) {
            structureGroup = node;
            if (node.name.toLowerCase() === 'spin') {
                spinGroup = node;
                node.traverse((child) => {
                     if (child.isMesh) {
                        child.material = child.material.clone();
                        child.userData.origColor = child.material.color.clone();
                        if(child.name.includes('arrow')) spinArrowMesh = child;
                        else spinButtonMesh = child;
                     }
                });
            }
            node.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        }

        function setupSymbol(node) {
             if (node.isMesh) { 
                 node.castShadow = true; 
                 node.receiveShadow = false; 
             }
        }

        function crearHilera(index) {
            const reelGroup = new THREE.Group();
            reelGroup.position.x = (index * SEPARACION_CARRETES) - ((NUM_CARRETES - 1) * SEPARACION_CARRETES / 2);
            scene.add(reelGroup);
            reels.push(reelGroup);
            
            for (let i = 0; i < NUM_ITEMS_POR_RUEDA; i++) {
                // --- SELECCIÓN DEL MODELO SEGÚN ARRAY ---
                const glbName = ARCHIVOS_GLB[i % ARCHIVOS_GLB.length];
                const model = symbolMasters[glbName].clone();
                
                const pivot = new THREE.Group();
                pivot.rotation.x = (i * ANGLE_STEP);
                model.position.set(0, 0, RADIO_ORBITA_SIMBOLOS);
                model.traverse(setupSymbol);
                pivot.add(model);
                reelGroup.add(pivot);
            }
        }

        // =====================================================================
        // 5. LÓGICA DE JUEGO Y CÁMARA
        // =====================================================================
        
        function toggleVR() {
            isVRMode = !isVRMode;
            if (isVRMode) { 
                 if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                 activeCamera = cameraLandscape; 
            } else {
                 if (document.exitFullscreen) document.exitFullscreen();
                 onWindowResize(); 
            }
            adjustCameraTarget();
        }

        function onWindowResize() {
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setSize(w, h);
            effectVR.setSize(w, h);
            const aspect = w / h;

            cameraLandscape.aspect = aspect; cameraLandscape.updateProjectionMatrix();
            cameraPortrait.aspect = aspect; cameraPortrait.updateProjectionMatrix();

            checkOrientation();
            adjustCameraTarget();
        }

        function checkOrientation() {
            if (!isMobile) return;
            const isLandscape = window.innerWidth > window.innerHeight;
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (isLandscape && !isFS) overlay.style.display = 'flex';
            else overlay.style.display = 'none';
        }

        function adjustCameraTarget() {
            const aspect = window.innerWidth / window.innerHeight;
            
            if (aspect >= 1.0) { 
                activeCamera = cameraLandscape;
                targetZ = CAM_LAND_DIST; 
                targetY = CAM_LAND_Y;
            } else { 
                activeCamera = cameraPortrait;
                targetZ = MACHINE_WIDTH_FACTOR / aspect; 
                targetY = CAM_PORT_Y;
            }
            
            targetX = (activeCamera === cameraPortrait) ? CAM_PORT_X : CAM_LAND_X; 

            if (isVRMode) { targetZ = Z_VR; targetY = 0; targetX = 0; }
            else if (isZoomed) { targetZ = Z_ZOOM; targetY = 0; targetX = 0; }
        }

        function spinMachine() {
            if (machineIsSpinning || isButtonDisabled) return;
            machineIsSpinning = true; isButtonDisabled = true; isZoomed = false;
            adjustCameraTarget(); resetCoins();
            resultText.classList.remove('show');
            
            if(buttonAction) { buttonAction.reset(); buttonAction.play(); }
            isLightFlashing = true; setTimeout(() => isLightFlashing = false, 200);

            reelStates.forEach(s => { s.mode = 'SPINNING'; s.velocity = 0; });
            for (let i = 0; i < NUM_CARRETES; i++) setTimeout(() => {
                const state = reelStates[i];
                state.mode = 'STOPPING';
                const currentRot = reels[i].rotation.x;
                const nextRound = Math.ceil(currentRot / (Math.PI*2)) + 2 + i;
                const randIndex = Math.floor(Math.random() * NUM_ITEMS_POR_RUEDA);
                state.targetAngle = (nextRound * Math.PI * 2) + (randIndex * ANGLE_STEP);
            }, 500 + (i * 200));
        }

        function checkResults() {
             const results = reels.map(r => {
                 let ang = r.rotation.x % (Math.PI*2);
                 if(ang < 0) ang += Math.PI*2;
                 return Math.round(ang / ANGLE_STEP) % NUM_ITEMS_POR_RUEDA;
             });
             
             const names = results.map(i => NOMBRES_SIMBOLOS[(NUM_ITEMS_POR_RUEDA - i) % NUM_ITEMS_POR_RUEDA]);
             resultText.innerText = names.join(" - ");
             resultText.classList.add('show');

             if(names[0] === names[1] && names[1] === names[2]) {
                 resultText.innerText += " ¡PREMIO!";
                 isZoomed = true; 
                 adjustCameraTarget();
                 isButtonDisabled = true;

                 setTimeout(() => {
                     isZoomed = false;
                     adjustCameraTarget();
                     spawnCoins();
                     
                     setTimeout(() => {
                         isButtonDisabled = false;
                     }, 1500);
                     
                 }, 2000); 

             } else {
                 isButtonDisabled = false;
             }
        }

        function onPointerDown(e) {
            if (e.target.tagName === 'BUTTON') return;
            if (isButtonDisabled) return;

            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = - (e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, activeCamera);

            let hit = false;
            
            if (spinGroup) {
                const intersects = raycaster.intersectObject(spinGroup, true);
                if (intersects.length > 0) hit = true;
            } 
            if (!hit && structureGroup) {
                const intersects = raycaster.intersectObject(structureGroup, true);
                if (intersects.length > 0) hit = true;
            }

            if (hit) spinMachine();
        }

        function spawnCoins() {
             for(let i=0; i < COIN_COUNT; i++) {
                const data = coinsData[i]; data.active = true;
                data.position.set((Math.random() - 0.5) * COIN_SPREAD * 2, -8.0, 12.0 + (Math.random() * 4.0));
                data.velocity.set((Math.random() - 0.5) * 10.0, COIN_BLAST_FORCE + (Math.random() * 10), (Math.random() - 0.5) * 5.0);
                data.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            }
        }

        function resetCoins() {
            if (!coinInstancedMesh) return;
            for(let i=0; i < COIN_COUNT; i++) { coinsData[i].active = false; dummy.scale.set(0,0,0); dummy.updateMatrix(); coinInstancedMesh.setMatrixAt(i, dummy.matrix); }
            coinInstancedMesh.instanceMatrix.needsUpdate = true;
        }

        function updateCoins(delta) {
            if (!coinInstancedMesh) return;
            let activeCount = 0;
            for(let i=0; i < COIN_COUNT; i++) {
                const data = coinsData[i];
                if (data.active) {
                    data.velocity.y -= COIN_GRAVITY * delta; 
                    data.position.addScaledVector(data.velocity, delta);
                    data.rotation.x += 5 * delta; 
                    dummy.position.copy(data.position); 
                    dummy.rotation.set(data.rotation.x, data.rotation.y, data.rotation.z); 
                    dummy.scale.set(COIN_SCALE, COIN_SCALE, COIN_SCALE); 
                    dummy.updateMatrix();
                    coinInstancedMesh.setMatrixAt(i, dummy.matrix);
                    
                    if (data.position.y < -50) { 
                        data.active = false; 
                        dummy.scale.set(0,0,0); dummy.updateMatrix(); 
                        coinInstancedMesh.setMatrixAt(i, dummy.matrix); 
                    } else activeCount++;
                }
            }
            if (activeCount > 0) coinInstancedMesh.instanceMatrix.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const timeScale = delta * 60;

            if(buttonMixer) buttonMixer.update(delta);
            updateCoins(delta);

            let allIdle = true;
            reels.forEach((r, i) => {
                const s = reelStates[i];
                if(s.mode === 'SPINNING') {
                    allIdle = false;
                    if(s.velocity < 0.5) s.velocity += 0.02 * timeScale;
                    r.rotation.x += s.velocity * timeScale;
                } else if(s.mode === 'STOPPING') {
                    allIdle = false;
                    const diff = s.targetAngle - r.rotation.x;
                    s.velocity += diff * 0.25 * timeScale;
                    s.velocity *= Math.pow(0.80, timeScale);
                    r.rotation.x += s.velocity * timeScale;
                    if(Math.abs(diff) < 0.005 && Math.abs(s.velocity) < 0.005) {
                        r.rotation.x = s.targetAngle;
                        s.mode = 'IDLE';
                    }
                }
            });

            if(allIdle && machineIsSpinning) { machineIsSpinning = false; checkResults(); }

            if(pointLight) {
                if(isLightFlashing) { pointLight.intensity = 576; pointLight.distance = 134; }
                else pointLight.intensity = 0; 
            }

            activeCamera.position.x += (targetX - activeCamera.position.x) * 0.05 * timeScale;
            activeCamera.position.z += (targetZ - activeCamera.position.z) * 0.05 * timeScale;
            activeCamera.position.y += (targetY - activeCamera.position.y) * 0.05 * timeScale;

            if(isVRMode) effectVR.render(scene, activeCamera);
            else renderer.render(scene, activeCamera);
        }
    </script>
</body>
</html>
