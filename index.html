<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Slot Pro: Final v47 (Symbol Fading & Pulse Color)</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            background-color: #000; 
            font-family: 'Segoe UI', sans-serif; touch-action: none; 
            -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
        }
        
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; outline: none; }
        
        #loading {
            position: absolute; top: 50%; width: 100%; text-align: center; left: 0;
            color: #ffd700; font-size: 1.2rem; 
            text-shadow: 2px 2px 4px #000; transition: opacity 0.5s;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;
        }

        #result-text {
            position: absolute; top: 15vh; width: 100%; text-align: center;
            color: #fff; font-size: 2rem; font-weight: bold;
            text-shadow: 0 0 15px #ffd700; z-index: 20;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; transform: scale(0.8);
        }
        #result-text.show { opacity: 1; transform: scale(1); }

        .icon-btn {
            position: absolute; z-index: 100;
            background: rgba(0,0,0,0.5); border: 2px solid #fff;
            color: #fff; border-radius: 50%; width: 50px; height: 50px;
            font-size: 24px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

        #vr-btn { bottom: 20px; left: 20px; }
        #fs-manual-btn { top: 20px; right: 20px; font-size: 20px; }

        #landscape-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 999;
            display: none; 
            align-items: center; justify-content: center; flex-direction: column;
            color: #ffd700; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #landscape-overlay p { 
            font-size: 1.2rem; margin-bottom: 30px; text-transform: uppercase; 
            max-width: 16%; line-height: 1.5; color: #fff;
        }
        #enter-fs-btn {
              background: #ffd700; color: #000; border: none; padding: 20px 40px;
              font-size: 1.2rem; font-weight: bold; border-radius: 50px; cursor: pointer;
              text-transform: uppercase; box-shadow: 0 0 20px #ffd700;
              transition: transform 0.2s;
        }
        #enter-fs-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="loading">Cargando Recursos...</div>
    <div id="result-text">LISTO</div>

    <button id="vr-btn" class="icon-btn" title="Modo VR">👓</button>
    <button id="fs-manual-btn" class="icon-btn" title="Pantalla Completa">⛶</button>

    <div id="landscape-overlay">
        <p>Para jugar en horizontal necesitamos ocultar la barra del navegador.</p>
        <button id="enter-fs-btn">MODO CINE</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { StereoEffect } from 'three/addons/effects/StereoEffect.js';
        
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // =====================================================================
        // 1. CONFIGURACIÓN
        // =====================================================================
        const loadingText = document.getElementById('loading');
        const resultText = document.getElementById('result-text');
        
        const CYLINDER_TARGET_WIDTH = 19.0;
        
        const CAM_LAND_DIST = 25.0;  
        const CAM_LAND_Y = 0.9;     
        const CAM_PORT_Y = 0.0; 
        
        const Z_VR = 42; 
        const Z_ZOOM = 14; 
        const TEXT_Z_POS = 15.0; 

        const NUM_CARRETES = 3;
        const SEPARACION_CARRETES = 4.5;
        const NUM_ITEMS_POR_RUEDA = 8;
        const RADIO_ORBITA_SIMBOLOS = 6.0;
        const ANGLE_STEP = (Math.PI * 2) / NUM_ITEMS_POR_RUEDA;
        
        const ARCHIVOS_GLB = ['noel.glb', 'sirena.glb', 'xic.glb', 'goku.glb'];
        const NOMBRES_SIMBOLOS = ['Noel', 'Sirena', 'Xic', 'Goku', 'Noel', 'Sirena', 'Xic', 'Goku'];
        
        const config = {
            sunIntensity: 2.8, sunPosY: 30, sunPosZ: 20,
            fillIntensity: 2.62, fillColor: '#fffbca',
            btnHoverEmissive: 3.095, lightHoverInt: 213, lightClickInt: 2889, btnIdleEmissive: 0.3, lightIdleInt: 50,
            
            aoEnabled: false, aoRadius: 3.68, aoMinDist: 0.001, aoMaxDist: 0.08265,
            landscapeRotX: -0.1, portraitRotX: 0.0, camRotY: 0.0, camRotZ: 0.0
        };

        const CLICK_BTN_EMISSIVE = 20.0; 
        const COIN_COUNT = 150; 
        const SPARKLE_COUNT = 400;
        const DUST_COUNT = 1000; 
        
        const COIN_GRAVITY = 20.0; 
        const COIN_SCALE = 0.8;
        
        const SPAWN_Y = -25.0; 
        const SPAWN_Z = 12.0; 
        const MIN_APEX = 2.0; 
        const MAX_APEX = 5.0; 

        // =====================================================================
        // 2. ESCENA Y RENDERER
        // =====================================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        let activeCamera = camera;

        let targetX = 0;
        let targetY = CAM_LAND_Y;
        let targetZ = CAM_LAND_DIST;
        let targetRotX = config.landscapeRotX;

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); 
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.toneMapping = THREE.NoToneMapping;
        document.body.appendChild(renderer.domElement);

        let composer, ssaoPass;
        function initPostProcessing() {
            if (!config.aoEnabled) { composer = null; return; }
            const size = renderer.getDrawingBufferSize(new THREE.Vector2());
            const renderTarget = new THREE.WebGLRenderTarget(size.width, size.height, { samples: 4, type: THREE.HalfFloatType });
            composer = new EffectComposer(renderer, renderTarget);
            const renderPass = new RenderPass(scene, activeCamera);
            composer.addPass(renderPass);
            ssaoPass = new SSAOPass(scene, activeCamera, window.innerWidth, window.innerHeight);
            ssaoPass.kernelRadius = config.aoRadius;
            ssaoPass.minDistance = config.aoMinDist;
            ssaoPass.maxDistance = config.aoMaxDist;
            ssaoPass.output = SSAOPass.OUTPUT.Default; 
            composer.addPass(ssaoPass);
            const outputPass = new OutputPass();
            composer.addPass(outputPass);
        }

        const effectVR = new StereoEffect(renderer);
        effectVR.eyeSeparation = 0.005;
        effectVR.setSize(window.innerWidth, window.innerHeight);

        const loader = new GLTFLoader();
        const textureLoader = new THREE.TextureLoader();
        const clock = new THREE.Clock();
        const reels = [];
        const reelStates = Array(NUM_CARRETES).fill(null).map(() => ({ mode: 'IDLE', velocity: 0, targetAngle: 0 }));
        const symbolMasters = {};
        
        const coinsData = [];
        const sparklesData = [];
        const dustData = [];
        
        let coinInstancedMesh;
        let haloInstancedMesh; 
        let sparkleInstancedMesh; 
        let dustInstancedMesh;
        
        let dummy = new THREE.Object3D();
        let colorDummy = new THREE.Color();
        
        let spinGroup = null; let structureGroup = null;      
        let spinButtonMesh = null, spinArrowMesh = null;
        let machineIsSpinning = false, isButtonDisabled = false, isZoomed = false, isVRMode = false;
        let buttonMixer = null, buttonAction = null;
        
        let winAnimState = { active: false, startTime: 0, duration: 1.0 };
        let isRewardActive = false; 
        let spinCounter = 0;
        let wasHoveringState = false; 

        let sunLight = null; let fillLight = null; let pointLight = null; let isLightFlashing = false;
        let loadedFont = null; 
        let textMesh3D = null;
        
        const goldTextMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffd700, 
            metalness: 1.0,      
            roughness: 0.01,    
            envMapIntensity: 5.0 
        });
        
        // MODIFICACIÓN V47: Colores para el pulso del texto
        const pulseColorNormal = new THREE.Color(0xffd700); // Dorado
        const pulseColorBright = new THREE.Color(0xffff55); // Amarillo muy brillante

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        const overlay = document.getElementById('landscape-overlay');
        const enterFsBtn = document.getElementById('enter-fs-btn');
        const manualFsBtn = document.getElementById('fs-manual-btn');
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // =====================================================================
        // 3. INICIALIZACIÓN
        // =====================================================================
        init();

        async function init() {
            try {
                loadingText.innerText = "Cargando Entorno...";
                const cubemapTexture = await new Promise((resolve, reject) => textureLoader.load('cubemap.jpg', resolve, undefined, reject));
                cubemapTexture.mapping = THREE.EquirectangularReflectionMapping;
                const pmremGenerator = new THREE.PMREMGenerator(renderer);
                pmremGenerator.compileEquirectangularShader();
                const envMap = pmremGenerator.fromEquirectangular(cubemapTexture).texture;
                scene.environment = envMap;
                cubemapTexture.dispose(); pmremGenerator.dispose();

                createLights();

                loadingText.innerText = "Cargando Texturas FX (WebP)...";
                const haloTex = await safeLoadTexture('halo_monedas.webp');
                const sparkleTex = await safeLoadTexture('destello.webp');

                loadingText.innerText = "Cargando Tipografía...";
                const fontLoader = new FontLoader();
                loadedFont = await new Promise((resolve, reject) => {
                    fontLoader.load('https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json', resolve, undefined, reject);
                });

                loadingText.innerText = "Cargando Modelos...";
                const uniqueFiles = [...new Set(ARCHIVOS_GLB)];
                for (const file of uniqueFiles) await safeLoadSymbol(file);
                await safeLoadStructure('cilindro.glb');
                await safeLoadCoins('moneda.glb');

                createParticleSystems(haloTex, sparkleTex);

                loadingText.innerText = "Construyendo Slot...";
                for(let r = 0; r < NUM_CARRETES; r++) crearHilera(r);
                
                for(let i=0; i<COIN_COUNT; i++) {
                    coinsData.push({ 
                        position: new THREE.Vector3(), velocity: new THREE.Vector3(), rotation: new THREE.Euler(), active: false, life: 0, offsetPhase: Math.random() * Math.PI * 2 
                    });
                }
                for(let i=0; i<SPARKLE_COUNT; i++) {
                    sparklesData.push({
                        position: new THREE.Vector3(), originPos: new THREE.Vector3(), velocity: new THREE.Vector3(), active: false, delay: 0, life: 0, offsetPhase: Math.random() * Math.PI * 2, baseScale: 0.2 + Math.random() * 0.8 
                    });
                }
                for(let i=0; i<DUST_COUNT; i++) {
                    dustData.push({
                        position: new THREE.Vector3(), originPos: new THREE.Vector3(), velocity: new THREE.Vector3(), active: false, delay: 0, life: 0, offsetPhase: Math.random() * Math.PI * 2,
                        baseScale: 0.1 + Math.random() * 0.3,
                        color: new THREE.Color() 
                    });
                }

                forceShadows(scene);
                
                if (coinInstancedMesh) { coinInstancedMesh.castShadow = false; coinInstancedMesh.receiveShadow = true; }
                if (haloInstancedMesh) { haloInstancedMesh.castShadow = false; haloInstancedMesh.receiveShadow = false; }
                if (sparkleInstancedMesh) { sparkleInstancedMesh.castShadow = false; sparkleInstancedMesh.receiveShadow = false; }
                if (dustInstancedMesh) { dustInstancedMesh.castShadow = false; dustInstancedMesh.receiveShadow = false; }

                initPostProcessing();

                loadingText.style.display = 'none';
                window.addEventListener('resize', onWindowResize);
                window.addEventListener('pointerdown', onPointerDown);
                window.addEventListener('pointermove', onPointerMove);
                document.getElementById('vr-btn').addEventListener('click', toggleVR);
                enterFsBtn.addEventListener('click', requestFullscreen);
                manualFsBtn.addEventListener('click', toggleFullscreen);
                document.addEventListener('fullscreenchange', checkOrientation);
                document.addEventListener('webkitfullscreenchange', checkOrientation);
                onWindowResize(); 
                animate();
            } catch (err) {
                loadingText.innerText = "Error: " + err.message; console.error(err);
            }
        }

        async function safeLoadTexture(url) {
            return new Promise(resolve => {
                textureLoader.load(url, resolve, undefined, () => {
                    console.warn(`Textura ${url} no encontrada, usando fallback.`);
                    const canvas = document.createElement('canvas'); canvas.width = 64; canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(32,32,15,0,Math.PI*2); ctx.fill();
                    const tex = new THREE.CanvasTexture(canvas);
                    resolve(tex);
                });
            });
        }

        function createParticleSystems(haloTex, sparkleTex) {
            const haloMat = new THREE.MeshBasicMaterial({ map: haloTex, color: 0xffd700, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, alphaTest: 0.05 });
            const geo = new THREE.PlaneGeometry(1.8, 1.8); 
            haloInstancedMesh = new THREE.InstancedMesh(geo, haloMat, COIN_COUNT);
            haloInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(haloInstancedMesh);

            const sparkleMat = new THREE.MeshBasicMaterial({ map: sparkleTex, color: 0xffffff, transparent: true, opacity: 1.0, blending: THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide });
            const geoS = new THREE.PlaneGeometry(0.5, 0.5); 
            sparkleInstancedMesh = new THREE.InstancedMesh(geoS, sparkleMat, SPARKLE_COUNT);
            sparkleInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(sparkleInstancedMesh);
            
            const dustMat = new THREE.MeshBasicMaterial({ map: sparkleTex, color: 0xffffff, transparent: true, opacity: 1.0, blending: THREE.NormalBlending, depthWrite: false, side: THREE.DoubleSide });
            const geoD = new THREE.PlaneGeometry(0.4, 0.4); 
            dustInstancedMesh = new THREE.InstancedMesh(geoD, dustMat, DUST_COUNT);
            dustInstancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(dustInstancedMesh);

            for(let i=0; i<COIN_COUNT; i++) { dummy.scale.set(0,0,0); dummy.updateMatrix(); haloInstancedMesh.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<SPARKLE_COUNT; i++) { dummy.scale.set(0,0,0); dummy.updateMatrix(); sparkleInstancedMesh.setMatrixAt(i, dummy.matrix); }
            for(let i=0; i<DUST_COUNT; i++) { dummy.scale.set(0,0,0); dummy.updateMatrix(); dustInstancedMesh.setMatrixAt(i, dummy.matrix); }
        }

        function show3DResult(textStr) {
            if (textMesh3D) { 
                scene.remove(textMesh3D); 
                textMesh3D.geometry.dispose();
                if(textMesh3D.material) textMesh3D.material.dispose();
                textMesh3D = null;
            }
            
            const geometry = new TextGeometry(textStr, { font: loadedFont, size: 2.0, height: 0.4, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.03, bevelOffset: 0, bevelSegments: 5 });
            geometry.computeBoundingBox();
            const xOffset = -0.5 * (geometry.boundingBox.max.x - geometry.boundingBox.min.x);
            const yOffset = -0.5 * (geometry.boundingBox.max.y - geometry.boundingBox.min.y);
            geometry.translate(xOffset, yOffset, 0);
            
            textMesh3D = new THREE.Mesh(geometry, goldTextMaterial.clone());
            
            const textWidth = geometry.boundingBox.max.x - geometry.boundingBox.min.x;
            const dist = activeCamera.position.z - TEXT_Z_POS; 
            const vFOV = THREE.MathUtils.degToRad(activeCamera.fov); 
            const visibleHeight = 2 * Math.tan(vFOV / 2) * dist;
            const visibleWidth = visibleHeight * activeCamera.aspect;
            
            let scaleFactor = (visibleWidth * 0.8) / textWidth;
            scaleFactor = Math.min(scaleFactor, 0.56); 

            textMesh3D.userData.baseScale = scaleFactor;

            textMesh3D.scale.set(scaleFactor, scaleFactor, scaleFactor);
            textMesh3D.position.set(0, activeCamera.position.y, TEXT_Z_POS); 
            textMesh3D.castShadow = true;
            scene.add(textMesh3D);
        }

        function forceShadows(parent) {
            parent.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true; child.receiveShadow = true;
                    if(child.material && (child.material.transparent || child.material.alphaTest > 0)) {
                        child.customDepthMaterial = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: child.material.map, alphaTest: 0.5 });
                    }
                }
            });
        }

        function updateSunPos() { if(sunLight) sunLight.position.set(-10, config.sunPosY, config.sunPosZ); }
        function requestFullscreen() { const docEl = document.documentElement; const requestMethod = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen; if (requestMethod) { requestMethod.call(docEl).then(() => { overlay.style.display = 'none'; checkOrientation(); }).catch(e => { overlay.style.display = 'none'; }); } }
        function toggleFullscreen() { if (!document.fullscreenElement && !document.webkitFullscreenElement) { requestFullscreen(); } else { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } }

        async function safeLoadSymbol(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => { symbolMasters[file] = gltf.scene; resolve(); }, undefined, () => {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: Math.random() * 0xffffff}));
                    // MODIFICACIÓN V47: Habilitar transparencia para el fading
                    mesh.material.transparent = true;
                    const g = new THREE.Group(); g.add(mesh); symbolMasters[file] = g; resolve();
                });
            });
        }

        async function safeLoadStructure(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => {
                    setupStructure(gltf.scene);
                    if(gltf.animations.length) {
                        buttonMixer = new THREE.AnimationMixer(gltf.scene);
                        buttonAction = buttonMixer.clipAction(gltf.animations[0]);
                        buttonAction.loop = THREE.LoopOnce; buttonAction.clampWhenFinished = true;
                    }
                    scene.add(gltf.scene); resolve();
                }, undefined, () => resolve());
            });
        }

        async function safeLoadCoins(file) {
            return new Promise(resolve => {
                loader.load(file, (gltf) => {
                    let geo, mat;
                    gltf.scene.traverse(n => { if(n.isMesh){ geo = n.geometry; mat = n.material; } });
                    createCoinMesh(geo, mat); resolve();
                }, undefined, () => {
                    const geo = new THREE.CylinderGeometry(0.5,0.5,0.1,8);
                    const mat = new THREE.MeshStandardMaterial({color:0xffd700});
                    createCoinMesh(geo, mat); resolve();
                });
            });
        }

        function createCoinMesh(geo, mat) {
            coinInstancedMesh = new THREE.InstancedMesh(geo, mat, COIN_COUNT);
            coinInstancedMesh.castShadow = false; 
            coinInstancedMesh.receiveShadow = true;
            for(let i=0; i<COIN_COUNT; i++) { dummy.scale.set(0,0,0); dummy.updateMatrix(); coinInstancedMesh.setMatrixAt(i, dummy.matrix); }
            coinInstancedMesh.instanceMatrix.needsUpdate = true; scene.add(coinInstancedMesh);
        }

        function createLights() {
            const amb = new THREE.AmbientLight(0xffffff, 0.6); scene.add(amb);
            sunLight = new THREE.DirectionalLight(0xfffee0, config.sunIntensity);
            sunLight.position.set(-10, config.sunPosY, config.sunPosZ);
            sunLight.castShadow = true; 
            sunLight.target.position.set(0, 0, 0); scene.add(sunLight.target);
            sunLight.shadow.mapSize.set(1024, 1024);
            const d = 30; sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d; sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005; sunLight.shadow.normalBias = 0.02; scene.add(sunLight);

            const fillPivot = new THREE.Object3D(); fillPivot.rotation.set(-3.06, -1.36, -2.31); scene.add(fillPivot);
            fillLight = new THREE.DirectionalLight(config.fillColor, config.fillIntensity);
            fillLight.position.set(-8.10, -4.57, -7.28); fillPivot.add(fillLight);

            pointLight = new THREE.PointLight(0xffaa00, 0, 100);
            pointLight.position.set(0, -5, 16);
            pointLight.castShadow = true;
            pointLight.shadow.bias = -0.0001; pointLight.shadow.normalBias = 0.02; 
            pointLight.shadow.mapSize.width = 1024; pointLight.shadow.mapSize.height = 1024;
            pointLight.shadow.camera.near = 0.1; scene.add(pointLight);
        }

        function setupStructure(node) {
            structureGroup = node;
            if (node.name.toLowerCase() === 'spin') {
                spinGroup = node;
                node.traverse((child) => { if (child.isMesh) { child.material = child.material.clone(); child.userData.origColor = child.material.color.clone(); if(child.name.includes('arrow')) spinArrowMesh = child; else spinButtonMesh = child; } });
            }
        }

        function crearHilera(index) {
            const reelGroup = new THREE.Group();
            reelGroup.position.x = (index * SEPARACION_CARRETES) - ((NUM_CARRETES - 1) * SEPARACION_CARRETES / 2);
            scene.add(reelGroup); reels.push(reelGroup);
            for (let i = 0; i < NUM_ITEMS_POR_RUEDA; i++) {
                const glbName = ARCHIVOS_GLB[i % ARCHIVOS_GLB.length]; 
                // MODIFICACIÓN V47: Habilitar transparencia en símbolos clonados
                const model = symbolMasters[glbName].clone();
                model.traverse(child => {
                    if (child.isMesh) {
                        child.material = child.material.clone();
                        child.material.transparent = true;
                        child.userData.originalColor = child.material.color.clone();
                    }
                });
                
                const pivot = new THREE.Group(); pivot.rotation.x = (i * ANGLE_STEP);
                model.position.set(0, 0, RADIO_ORBITA_SIMBOLOS); pivot.add(model); reelGroup.add(pivot);
            }
        }

        function toggleVR() { isVRMode = !isVRMode; if (isVRMode) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); activeCamera = camera; } else { if (document.exitFullscreen) document.exitFullscreen(); onWindowResize(); } adjustCameraTarget(); }
        
        function onWindowResize() { 
            const w = window.innerWidth, h = window.innerHeight; 
            renderer.setSize(w, h); 
            if(composer) { composer.setSize(w, h); } 
            effectVR.setSize(w, h); 
            
            camera.aspect = w / h; 
            camera.updateProjectionMatrix(); 
            
            checkOrientation(); 
            adjustCameraTarget();
        }
        
        function checkOrientation() { if (!isMobile) return; const isLandscape = window.innerWidth > window.innerHeight; const isFS = document.fullscreenElement || document.webkitFullscreenElement; if (isLandscape && !isFS) overlay.style.display = 'flex'; else overlay.style.display = 'none'; }
        
        function adjustCameraTarget() { 
            const aspect = window.innerWidth / window.innerHeight; 
            
            if (aspect >= 1.0) { 
                // Landscape
                camera.fov = 40;
                targetZ = CAM_LAND_DIST; 
                targetY = CAM_LAND_Y; 
                targetRotX = config.landscapeRotX;
            } else { 
                // Portrait
                camera.fov = 75; 
                targetZ = (CYLINDER_TARGET_WIDTH / 2.0) / (aspect * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2.0)));
                targetY = CAM_PORT_Y; 
                targetRotX = config.portraitRotX;
            } 
            
            camera.updateProjectionMatrix(); 
            
            targetX = 0.0; 
            
            if (isVRMode) { targetZ = Z_VR; targetY = 0; targetX = 0; targetRotX = 0; } 
            else if (isZoomed) { 
                targetZ = Z_ZOOM; 
                targetY = (aspect >= 1.0) ? CAM_LAND_Y : CAM_PORT_Y;
                targetRotX = (aspect >= 1.0) ? config.landscapeRotX : config.portraitRotX;
                targetX = 0; 
            } 
        }

        function spinMachine() {
            if (machineIsSpinning || isButtonDisabled) return;
            machineIsSpinning = true; isButtonDisabled = true; isZoomed = false;
            adjustCameraTarget(); resetCoinsAndFX();
            
            resultText.classList.remove('show');
            if (textMesh3D) {
                scene.remove(textMesh3D);
                textMesh3D.geometry.dispose();
                if(textMesh3D.material) textMesh3D.material.dispose();
                textMesh3D = null;
            }

            if(buttonAction) { buttonAction.reset(); buttonAction.play(); }
            isLightFlashing = true; setTimeout(() => isLightFlashing = false, 200);
            spinCounter++; 
            const forceWin = true; 
            reelStates.forEach(s => { s.mode = 'SPINNING'; s.velocity = 0; });
            for (let i = 0; i < NUM_CARRETES; i++) setTimeout(() => {
                const state = reelStates[i]; state.mode = 'STOPPING';
                const currentRot = reels[i].rotation.x; const nextRound = Math.ceil(currentRot / (Math.PI*2)) + 2 + i;
                let randIndex; if (forceWin) { randIndex = 0; } else { randIndex = Math.floor(Math.random() * NUM_ITEMS_POR_RUEDA); }
                state.targetAngle = (nextRound * Math.PI * 2) + (randIndex * ANGLE_STEP);
            }, 500 + (i * 200));
        }

        function checkResults() {
             const results = reels.map(r => { let ang = r.rotation.x % (Math.PI*2); if(ang < 0) ang += Math.PI*2; return Math.round(ang / ANGLE_STEP) % NUM_ITEMS_POR_RUEDA; });
             const names = results.map(i => NOMBRES_SIMBOLOS[(NUM_ITEMS_POR_RUEDA - i) % NUM_ITEMS_POR_RUEDA]);
             
             if(names[0] === names[1] && names[1] === names[2]) {
                 show3DResult("HAS GANADO!!");
                 isButtonDisabled = true; isRewardActive = true;
                 winAnimState.active = true; winAnimState.startTime = clock.getElapsedTime();
             } else { 
                 resultText.innerText = names.join(" - "); 
                 resultText.classList.add('show');
                 isButtonDisabled = false; 
             }
        }

        let isHovering = false;
        function onPointerMove(e) { pointer.x = (e.clientX / window.innerWidth) * 2 - 1; pointer.y = - (e.clientY / window.innerHeight) * 2 + 1; if (!isButtonDisabled && (spinGroup || structureGroup)) { raycaster.setFromCamera(pointer, activeCamera); let hit = false; if (spinGroup && raycaster.intersectObject(spinGroup, true).length > 0) hit = true; else if (structureGroup && raycaster.intersectObject(structureGroup, true).length > 0) hit = true; isHovering = hit; document.body.style.cursor = hit ? 'pointer' : 'default'; } else { isHovering = false; document.body.style.cursor = 'default'; } }
        function onPointerDown(e) { if (e.target.tagName === 'BUTTON') return; if (isButtonDisabled) return; pointer.x = (e.clientX / window.innerWidth) * 2 - 1; pointer.y = - (e.clientY / window.innerHeight) * 2 + 1; raycaster.setFromCamera(pointer, activeCamera); let hit = false; if (spinGroup && raycaster.intersectObject(spinGroup, true).length > 0) hit = true; if (!hit && structureGroup && raycaster.intersectObject(structureGroup, true).length > 0) hit = true; if (hit) spinMachine(); }
        
        function spawnCoins() { 
            const textCenterY = activeCamera.position.y; 

            for(let i=0; i < COIN_COUNT; i++) { 
                const data = coinsData[i]; data.active = true; 
                const targetHeight = MIN_APEX + Math.random() * (MAX_APEX - MIN_APEX);
                const height = targetHeight - SPAWN_Y;
                const v0 = Math.sqrt(2 * COIN_GRAVITY * height); 
                data.position.set((Math.random() - 0.5) * 15.0, SPAWN_Y, SPAWN_Z + (Math.random() * 4.0)); 
                data.velocity.set((Math.random() - 0.5) * 8.0, v0 + (Math.random() * 2.0), (Math.random() - 0.5) * 4.0); 
                data.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI); 
            }

            for(let i=0; i < SPARKLE_COUNT; i++) {
                const data = sparklesData[i]; data.active = true; 
                data.delay = 0; 
                data.life = 3.0 + Math.random() * 2.0;
                const angle = Math.random() * Math.PI * 2;
                const radius = (7.0 + Math.random() * 4.0) * 0.7; 
                data.originPos.set(radius * Math.cos(angle), textCenterY + (radius * Math.sin(angle) * 0.7), TEXT_Z_POS + (Math.random() - 0.5) * 5.0);
                data.position.copy(data.originPos);
                data.velocity.set((Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5, (Math.random() - 0.5) * 0.5);
            }

            for(let i=0; i < DUST_COUNT; i++) {
                const data = dustData[i]; data.active = true;
                data.delay = 0; 
                data.life = 4.0 + Math.random() * 2.0; 
                const angle = Math.random() * Math.PI * 2;
                const radius = (6.0 + Math.random() * 5.0) * 0.7; 
                data.originPos.set(radius * Math.cos(angle), textCenterY + (radius * Math.sin(angle) * 0.8), TEXT_Z_POS + (Math.random() - 0.5) * 8.0);
                data.position.copy(data.originPos);
                data.velocity.set((Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.2);
                data.color.setHSL(0.11, 1.0, 0.7 + Math.random() * 0.3);
            }
        }
        
        function resetCoinsAndFX() { 
            if (!coinInstancedMesh) return; 
            dummy.scale.set(0,0,0); dummy.updateMatrix(); 
            for(let i=0; i < COIN_COUNT; i++) { coinsData[i].active = false; coinInstancedMesh.setMatrixAt(i, dummy.matrix); }
            coinInstancedMesh.instanceMatrix.needsUpdate = true; 
            if(haloInstancedMesh) {
                for(let i=0; i < COIN_COUNT; i++) haloInstancedMesh.setMatrixAt(i, dummy.matrix);
                haloInstancedMesh.instanceMatrix.needsUpdate = true;
            }
            if(sparkleInstancedMesh) {
                for(let i=0; i < SPARKLE_COUNT; i++) { sparklesData[i].active = false; sparkleInstancedMesh.setMatrixAt(i, dummy.matrix); }
                sparkleInstancedMesh.instanceMatrix.needsUpdate = true;
            }
            if(dustInstancedMesh) {
                for(let i=0; i < DUST_COUNT; i++) { dustData[i].active = false; dustInstancedMesh.setMatrixAt(i, dummy.matrix); }
                dustInstancedMesh.instanceMatrix.needsUpdate = true;
            }
        }

        // MODIFICACIÓN V47: Pulsación con cambio de color amarillo brillante
        function updateWinTextAnim(time) {
            if (!textMesh3D || !winAnimState.active) return;

            const base = textMesh3D.userData.baseScale || 0.56;
            const elapsed = clock.getElapsedTime() - winAnimState.startTime;
            
            // Pulsación: Sube a 120% y baja entre el segundo 3.5 y 4.0
            const pulseStart = 3.5;
            const pulseDur = 0.5;
            
            let pulseScale = 1.0;
            let pulseFactor = 0.0;
            
            if (elapsed >= pulseStart && elapsed < pulseStart + pulseDur) {
                const t = (elapsed - pulseStart) / pulseDur; 
                // Curva suave de subida y bajada (sinusoidal 0 -> 1 -> 0)
                pulseFactor = Math.sin(t * Math.PI);
                
                // Escala de 1.0 a 1.2
                pulseScale = 1.0 + 0.2 * pulseFactor;
            }
            
            const currentScale = base * pulseScale;
            textMesh3D.scale.set(currentScale, currentScale, currentScale);

            // Cambio de color: De Dorado (base) a Amarillo Brillante (pico) y vuelta
            textMesh3D.material.color.lerpColors(pulseColorNormal, pulseColorBright, pulseFactor);
            // Aumentar emisión de luz en el pico
            textMesh3D.material.emissive.setScalar(pulseFactor * 0.5);
        }

        // MODIFICACIÓN V47: Función para ocultar/oscurecer símbolos traseros
        function updateSymbolVisibility() {
            reels.forEach((reelGroup) => {
                const reelAngle = reelGroup.rotation.x;
                reelGroup.children.forEach((pivotGroup, i) => {
                    // Calcular ángulo global del símbolo (teniendo en cuenta la rotación del carrete)
                    // Ajustamos el offset para que 0 sea "al frente"
                    const symbolAngle = pivotGroup.rotation.x; 
                    let totalAngle = (reelAngle + symbolAngle) % (Math.PI * 2);
                    if(totalAngle < 0) totalAngle += (Math.PI * 2);

                    // Coseno del ángulo: 1.0 es frente, 0.0 es arriba/abajo, -1.0 es atrás
                    const visFactor = Math.cos(totalAngle);

                    // Lógica de desvanecimiento
                    // Si visFactor > 0.5 (aprox +/- 60 grados), opacidad 1.
                    // Si visFactor < 0 (atrás), opacidad 0.
                    // Interpolación entre 0.5 y 0.0
                    let opacity = 1.0;
                    if (visFactor < 0.5) {
                        opacity = Math.max(0, (visFactor) / 0.5); 
                    }
                    
                    // Aplicar a todos los meshes del símbolo (el GLB puede tener varios hijos)
                    const symbolWrapper = pivotGroup.children[0]; // El grupo o mesh cargado
                    if (symbolWrapper) {
                        symbolWrapper.traverse((child) => {
                            if (child.isMesh && child.material) {
                                child.material.opacity = opacity;
                                
                                // También oscurecer el color para que se funda con el negro del fondo
                                if (child.userData.originalColor) {
                                    child.material.color.copy(child.userData.originalColor).multiplyScalar(opacity);
                                }
                            }
                        });
                    }
                });
            });
        }

        function updateParticles(delta, time) {
            let activeCoinCount = 0;
            if (coinInstancedMesh && haloInstancedMesh) {
                for(let i=0; i < COIN_COUNT; i++) {
                    const data = coinsData[i];
                    if (data.active) {
                        data.velocity.y -= COIN_GRAVITY * delta;
                        data.position.addScaledVector(data.velocity, delta);
                        data.rotation.x += 5 * delta;
                        dummy.position.copy(data.position); dummy.rotation.set(data.rotation.x, data.rotation.y, data.rotation.z); dummy.scale.set(COIN_SCALE, COIN_SCALE, COIN_SCALE); dummy.updateMatrix(); coinInstancedMesh.setMatrixAt(i, dummy.matrix);
                        dummy.rotation.set(0,0,0); dummy.quaternion.copy(activeCamera.quaternion); dummy.position.copy(data.position);
                        const blink = 0.5 + 0.5 * Math.sin(time * 10.0 + data.offsetPhase); colorDummy.setHSL(0.14, 1.0, 0.5 * blink); 
                        dummy.scale.set(1, 1, 1); dummy.updateMatrix(); haloInstancedMesh.setMatrixAt(i, dummy.matrix); haloInstancedMesh.setColorAt(i, colorDummy);
                        if (data.position.y < SPAWN_Y - 10) {  data.active = false; dummy.scale.set(0,0,0); dummy.updateMatrix(); coinInstancedMesh.setMatrixAt(i, dummy.matrix); haloInstancedMesh.setMatrixAt(i, dummy.matrix);
                        } else activeCoinCount++;
                    }
                }
                if (activeCoinCount > 0) { coinInstancedMesh.instanceMatrix.needsUpdate = true; haloInstancedMesh.instanceMatrix.needsUpdate = true; if(haloInstancedMesh.instanceColor) haloInstancedMesh.instanceColor.needsUpdate = true; }
            }

            let activeSparkleCount = 0;
            if (sparkleInstancedMesh) {
                for(let i=0; i < SPARKLE_COUNT; i++) {
                    const data = sparklesData[i];
                    if (data.active) {
                        if (data.delay > 0) { data.delay -= delta; dummy.scale.set(0,0,0); dummy.updateMatrix(); sparkleInstancedMesh.setMatrixAt(i, dummy.matrix); continue; }
                        data.originPos.addScaledVector(data.velocity, delta); 
                        data.position.x = data.originPos.x + Math.sin(time * 1.5 + data.offsetPhase) * 1.5;
                        data.position.y = data.originPos.y + Math.cos(time * 1.2 + data.offsetPhase) * 0.5;
                        data.position.z = data.originPos.z;
                        data.life -= delta;
                        if (data.life <= 0) { data.active = false; dummy.scale.set(0,0,0); dummy.updateMatrix(); sparkleInstancedMesh.setMatrixAt(i, dummy.matrix);
                        } else {
                            dummy.position.copy(data.position); dummy.quaternion.copy(activeCamera.quaternion);
                            colorDummy.setHex(0xffffff);
                            const pulseFactor = 0.75 + 0.25 * Math.sin(time * Math.PI * 4); const finalScale = data.baseScale * pulseFactor;
                            dummy.scale.set(finalScale, finalScale, finalScale); dummy.updateMatrix(); sparkleInstancedMesh.setMatrixAt(i, dummy.matrix); sparkleInstancedMesh.setColorAt(i, colorDummy); activeSparkleCount++;
                        }
                    }
                }
                if (activeSparkleCount > 0 || spinCounter > 0) { sparkleInstancedMesh.instanceMatrix.needsUpdate = true; if(sparkleInstancedMesh.instanceColor) sparkleInstancedMesh.instanceColor.needsUpdate = true; }
            }

            let activeDustCount = 0;
            if (dustInstancedMesh) {
                for(let i=0; i < DUST_COUNT; i++) {
                    const data = dustData[i];
                    if (data.active) {
                        if (data.delay > 0) { data.delay -= delta; dummy.scale.set(0,0,0); dummy.updateMatrix(); dustInstancedMesh.setMatrixAt(i, dummy.matrix); continue; }
                        data.originPos.addScaledVector(data.velocity, delta); 
                        data.position.x = data.originPos.x + Math.sin(time * 0.8 + data.offsetPhase) * 0.8;
                        data.position.y = data.originPos.y + Math.cos(time * 0.6 + data.offsetPhase) * 0.3;
                        data.position.z = data.originPos.z;
                        data.life -= delta;
                        if (data.life <= 0) { data.active = false; dummy.scale.set(0,0,0); dummy.updateMatrix(); dustInstancedMesh.setMatrixAt(i, dummy.matrix);
                        } else {
                            dummy.position.copy(data.position); dummy.quaternion.copy(activeCamera.quaternion);
                            colorDummy.copy(data.color);
                            const pulseFactor = 0.85 + 0.15 * Math.sin(time * Math.PI * 2 + data.offsetPhase); const finalScale = data.baseScale * pulseFactor;
                            dummy.scale.set(finalScale, finalScale, finalScale); dummy.updateMatrix(); dustInstancedMesh.setMatrixAt(i, dummy.matrix); dustInstancedMesh.setColorAt(i, colorDummy); activeDustCount++;
                        }
                    }
                }
                if (activeDustCount > 0 || spinCounter > 0) { dustInstancedMesh.instanceMatrix.needsUpdate = true; if(dustInstancedMesh.instanceColor) dustInstancedMesh.instanceColor.needsUpdate = true; }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();
            const timeScale = delta * 60;

            if(buttonMixer) buttonMixer.update(delta);
            updateParticles(delta, time);
            updateWinTextAnim(time);
            
            // MODIFICACIÓN V47: Actualizar visibilidad de símbolos
            updateSymbolVisibility();

            let allIdle = true;
            reels.forEach((r, i) => {
                const s = reelStates[i];
                if(s.mode === 'SPINNING') { allIdle = false; if(s.velocity < 0.5) s.velocity += 0.02 * timeScale; r.rotation.x += s.velocity * timeScale; }
                else if(s.mode === 'STOPPING') { allIdle = false; const diff = s.targetAngle - r.rotation.x; s.velocity += diff * 0.25 * timeScale; s.velocity *= Math.pow(0.80, timeScale); r.rotation.x += s.velocity * timeScale; if(Math.abs(diff) < 0.005 && Math.abs(s.velocity) < 0.005) { r.rotation.x = s.targetAngle; s.mode = 'IDLE'; } }
            });
            if(allIdle && machineIsSpinning) { machineIsSpinning = false; checkResults(); }

            let targetBtnInt = 0; let targetLightInt = 0;
            let targetSun = config.sunIntensity; let targetFill = config.fillIntensity;

            const effectiveHover = (isHovering && !isButtonDisabled && !isRewardActive);

            if (effectiveHover !== wasHoveringState) {
                if (sunLight) sunLight.castShadow = !effectiveHover; 
                wasHoveringState = effectiveHover;
            }

            if (isRewardActive) {
                targetSun = config.sunIntensity; targetFill = config.fillIntensity;
            } else if (effectiveHover) {
                targetSun = config.sunIntensity * 0.5; targetFill = 0.0; 
            }
            
            if (sunLight) sunLight.intensity += (targetSun - sunLight.intensity) * 0.1;
            if (fillLight) fillLight.intensity += (targetFill - fillLight.intensity) * 0.1;

            if (isLightFlashing) {
                targetBtnInt = CLICK_BTN_EMISSIVE; targetLightInt = config.lightClickInt; if(pointLight) pointLight.color.setHex(0xFFFFFF);
            } else if (isButtonDisabled && isRewardActive) {
                targetBtnInt = 0.0; targetLightInt = 0; if(pointLight) pointLight.color.setHex(0xFFAA00); 
            } else if (isButtonDisabled) {
                targetBtnInt = 0.0; targetLightInt = 0; if(pointLight) pointLight.color.setHex(0xFFAA00);
            } else {
                targetBtnInt = effectiveHover ? config.btnHoverEmissive : config.btnIdleEmissive;
                targetLightInt = effectiveHover ? config.lightHoverInt : config.lightIdleInt;
                if(pointLight) pointLight.color.setHex(0xFFAA00);
            }

            if (spinButtonMesh && spinButtonMesh.material) spinButtonMesh.material.emissiveIntensity += (targetBtnInt - spinButtonMesh.material.emissiveIntensity) * 0.2;
            if (pointLight) { pointLight.intensity += (targetLightInt - pointLight.intensity) * 0.2; pointLight.distance = 134; }

            let currentTargetZ = targetZ;
            let currentTargetY = targetY; 
            let cameraInterpolationSpeed = 0.05;

            activeCamera.rotation.set(targetRotX, config.camRotY, config.camRotZ);

            if (winAnimState.active && !isVRMode) {
                const elapsed = clock.getElapsedTime() - winAnimState.startTime;
                let t = elapsed / winAnimState.duration; 
                if (t >= 1.0) {
                    winAnimState.active = false; spawnCoins(); 
                    setTimeout(() => { 
                        isButtonDisabled = false; isRewardActive = false;
                        if (textMesh3D) { 
                            scene.remove(textMesh3D); 
                            textMesh3D.geometry.dispose();
                            if(textMesh3D.material) textMesh3D.material.dispose();
                            textMesh3D = null; 
                        }
                    }, 5000);
                } else {
                    const bounceFactor = Math.sin(t * Math.PI); 
                    currentTargetZ = THREE.MathUtils.lerp(targetZ, Z_ZOOM, bounceFactor);
                    cameraInterpolationSpeed = 0.2; 
                }
            }
            
            activeCamera.position.x += (targetX - activeCamera.position.x) * cameraInterpolationSpeed * timeScale;
            activeCamera.position.z += (currentTargetZ - activeCamera.position.z) * cameraInterpolationSpeed * timeScale;
            activeCamera.position.y += (currentTargetY - activeCamera.position.y) * cameraInterpolationSpeed * timeScale;

            if(isVRMode) effectVR.render(scene, activeCamera);
            else if (config.aoEnabled && composer) composer.render();
            else renderer.render(scene, activeCamera);
        }
    </script>
